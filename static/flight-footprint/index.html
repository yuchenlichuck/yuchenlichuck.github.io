<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>飞行足迹</title>
<meta name="description" content="个人飞行航线图：航线、机场与里程统计">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed night map; stat strip top-left; control rail right; flight panel docked right on desktop, bottom sheet on phone. */
:root{
  --bg:#061222;
  --land:#0f2a47; --land-edge:#1f4b75; --graticule:rgba(110,170,230,.10); --sphere:#081c33;
  --fg:#e4eefb; --muted:#8ea9c9; --dim:#52709a;
  --accent:#4fe4ff; --accent-strong:#c6f8ff; --glow:rgba(79,228,255,.55);
  --panel:rgba(7,19,36,.9); --panel-edge:rgba(120,190,255,.16); --row-hover:rgba(79,228,255,.08); --chip:rgba(79,228,255,.12);
  --warn:#ffb454;
  --font-display:"Rajdhani","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* map layers */
.sphere{fill:var(--sphere)}
.sphere-edge{fill:none;stroke:rgba(79,228,255,.35);stroke-width:1.2px}
.graticule{fill:none;stroke:var(--graticule);stroke-width:.5px}
.land{fill:var(--land)}
.borders{fill:none;stroke:var(--land-edge);stroke-linejoin:round}
.route-glow{fill:none;stroke:var(--accent);stroke-opacity:.14;stroke-linecap:round}
.route{fill:none;stroke:var(--accent);stroke-opacity:.78;stroke-linecap:round}
.flow{fill:none;stroke:var(--accent-strong);stroke-opacity:.95;stroke-linecap:round}
.hit{fill:none;stroke:transparent;stroke-width:12px;cursor:pointer;pointer-events:stroke}
body.no-anim .flow{display:none}
.r.dim .route{stroke-opacity:.1}.r.dim .route-glow{stroke-opacity:.03}.r.dim .flow{display:none}
.r.sel .route{stroke:var(--accent-strong);stroke-opacity:1}.r.sel .route-glow{stroke-opacity:.3}
.ap{cursor:pointer}
.ap .halo{fill:url(#apGlow)}
.ap .core{fill:var(--accent-strong);stroke:var(--accent)}
.ap .pulse{fill:none;stroke:var(--accent);transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
body.no-anim .pulse,body.no-anim .ap .pulse{display:none}
.ap.dim{opacity:.22}
.ap text{fill:var(--fg);font-family:var(--font-display);font-weight:700;letter-spacing:.02em;paint-order:stroke;stroke:rgba(6,18,34,.9);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.ap text .city{font-family:var(--font-body);font-weight:500;letter-spacing:0}
text.country{fill:var(--muted);font-family:var(--font-body);font-weight:500;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(6,18,34,.75);stroke-width:2.5px;stroke-linejoin:round}
text.continent{fill:rgba(142,169,201,.5);font-family:var(--font-body);font-weight:700;letter-spacing:.35em;text-anchor:middle;pointer-events:none}
@media (prefers-reduced-motion:reduce){.ap .pulse{animation:none;display:none}}

/* stat strip */
#stats{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:16px;right:16px;z-index:5;display:flex;align-items:center;gap:0;padding:8px 18px 8px 10px;max-width:max-content;background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 30px rgba(0,0,0,.35);pointer-events:none}
#stats .who{display:flex;align-items:center;gap:10px;padding-right:18px;margin-right:6px;border-right:1px solid var(--panel-edge)}
#stats .avatar{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1c4f7c,#0b2744 70%);border:1px solid rgba(79,228,255,.35);display:grid;place-items:center;flex:none}
#stats .avatar svg{width:22px;height:22px;fill:var(--accent)}
#stats .name{font-weight:700;font-size:15px;white-space:nowrap}
#stats .name small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
#stats .stat{display:flex;align-items:baseline;gap:5px;padding:0 12px;white-space:nowrap}
#stats .stat .lab{font-size:12px;color:var(--muted)}
#stats .stat b{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.01em}
#stats .stat .unit{font-size:12px;color:var(--muted)}
#stats .stat.minor{display:none}

/* rail */
#rail{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:8px}
#rail button{width:46px;height:46px;border-radius:10px;background:var(--panel);border:1px solid var(--panel-edge);color:var(--muted);font-family:var(--font-display);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .15s,border-color .15s}
#rail button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#rail button span{font-family:var(--font-body);font-size:10px;font-weight:500;line-height:1}
#rail button:hover,#rail button.on{color:var(--accent);border-color:rgba(79,228,255,.5)}
#rail #b-list{display:none}

/* legend */
#legend{position:absolute;left:16px;bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:5;font-size:11px;color:var(--muted);display:flex;gap:14px;align-items:center;padding:6px 10px;background:rgba(7,19,36,.6);border-radius:8px;pointer-events:none;flex-wrap:wrap}
#legend i{display:inline-block;vertical-align:middle;margin-right:5px}
#legend .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-strong);box-shadow:0 0 6px var(--glow)}
#legend .ln{width:18px;height:2px;background:var(--accent)}

/* panel */
#panel{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:78px;bottom:max(14px,env(safe-area-inset-bottom,0px));width:340px;z-index:5;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 30px rgba(0,0,0,.35);overflow:hidden;min-width:0}
#panel .handle{display:none}
#panel .years{display:flex;gap:6px;padding:12px 12px 0;flex-wrap:wrap}
#panel .years button{padding:4px 11px;border-radius:999px;border:1px solid var(--panel-edge);font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--muted);letter-spacing:.03em}
#panel .years button.on{background:var(--chip);color:var(--accent);border-color:rgba(79,228,255,.5)}
#panel .tabs{display:flex;padding:10px 12px 0;gap:2px;border-bottom:1px solid var(--panel-edge)}
#panel .tabs button{flex:1;padding:8px 4px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
#panel .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
#panel .filterbar{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--muted);background:rgba(79,228,255,.06);border-bottom:1px solid var(--panel-edge)}
#panel .filterbar b{color:var(--fg);font-weight:500}
#panel .filterbar button{margin-left:auto;color:var(--accent);font-size:12px}
#panel .list{flex:1;overflow:auto;overscroll-behavior:contain;padding:4px 0 10px;min-height:0}
.yh{position:sticky;top:0;display:flex;align-items:baseline;gap:8px;padding:8px 14px 4px;background:rgba(7,19,36,.95);font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--accent);letter-spacing:.04em;z-index:1}
.yh small{font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:7px 14px;cursor:pointer;border-left:2px solid transparent;min-width:0}
.row:hover{background:var(--row-hover)}
.row.on{background:var(--row-hover);border-left-color:var(--accent)}
.row .date{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.05;color:var(--fg);font-variant-numeric:tabular-nums}
.row .date small{display:block;font-size:10px;color:var(--dim);font-weight:500}
.row .main{min-width:0}
.row .l1{display:flex;align-items:baseline;gap:6px;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.row .l1 .arr{color:var(--accent);font-weight:500}
.row .l1 .fn{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.05em;margin-left:2px}
.row .l2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{text-align:right;font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--muted);line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .meta b{display:block;color:var(--fg);font-size:13px}
.badge{display:inline-block;font-family:var(--font-body);font-size:10px;font-weight:500;color:var(--warn);border:1px solid rgba(255,180,84,.5);border-radius:4px;padding:0 4px;line-height:1.5;vertical-align:middle;letter-spacing:0}
.badge.gray{color:var(--muted);border-color:var(--panel-edge)}
.rk{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:7px 14px;cursor:pointer;border-left:2px solid transparent;min-width:0}
.rk:hover,.rk.on{background:var(--row-hover)}
.rk.on{border-left-color:var(--accent)}
.rk .n{font-family:var(--font-display);font-weight:700;color:var(--dim);font-size:15px;text-align:right}
.rk .main{min-width:0}
.rk .t{display:flex;align-items:baseline;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .t b{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.03em}
.rk .t span{font-size:12.5px}
.rk .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .bar{height:3px;border-radius:2px;background:rgba(79,228,255,.14);margin-top:4px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.rk .v{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.rk .v small{display:block;font-family:var(--font-body);font-weight:400;font-size:10px;color:var(--muted)}
.empty{padding:30px 16px;color:var(--muted);text-align:center;font-size:13px}

/* tooltip */
#tip{position:absolute;z-index:20;max-width:280px;padding:10px 12px;background:rgba(7,19,36,.96);border:1px solid rgba(79,228,255,.35);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none;font-size:12px;color:var(--muted);line-height:1.5}
#tip h4{margin:0 0 2px;font-size:14px;color:var(--fg);font-weight:600}
#tip h4 b{font-family:var(--font-display);color:var(--accent);font-size:16px;letter-spacing:.04em;margin-right:6px}
#tip .kv{display:flex;gap:10px;margin:4px 0 6px;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--fg)}
#tip .kv span{color:var(--muted);font-family:var(--font-body);font-weight:400;font-size:11px}
#tip ul{margin:4px 0 0;padding:0;list-style:none;border-top:1px solid var(--panel-edge);padding-top:4px}
#tip li{display:flex;gap:8px;font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums}
#tip li span{color:var(--dim);font-weight:500}
#tip li em{font-style:normal;color:var(--muted);font-family:var(--font-body);font-weight:400;font-size:11px;margin-left:auto}

/* export modal */
#modal{position:absolute;inset:0;z-index:30;background:rgba(3,9,18,.82);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:14px;min-width:0}
#modal .bar{display:flex;align-items:center;gap:12px}
#modal .bar span{font-weight:600}
#modal .bar .dl{color:var(--accent);font-size:13px;border:1px solid rgba(79,228,255,.4);border-radius:8px;padding:4px 10px}
#modal .bar .close{margin-left:auto;color:var(--muted);border:1px solid var(--panel-edge);border-radius:8px;padding:4px 10px;font-size:13px}
#modal img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;border-radius:8px;border:1px solid var(--panel-edge)}
#modal .hint{margin:0;font-size:12px;color:var(--muted)}

/* poster mode (static export via screenshot) */
#poster-foot{display:none}
body.poster #rail,body.poster #panel,body.poster #legend{display:none}
body.poster #stats{top:36px;left:36px;padding:14px 28px 14px 16px;border-radius:18px}
body.poster #stats .stat b{font-size:34px}
body.poster #stats .stat .lab,body.poster #stats .stat .unit{font-size:13px}
body.poster #stats .stat.minor{display:flex}
body.poster #stats .avatar{width:56px;height:56px}
body.poster #stats .avatar svg{width:30px;height:30px}
body.poster #stats .name{font-size:20px}
body.poster #stats .name small{font-size:13px}
body.poster #poster-foot{display:block;position:absolute;right:40px;bottom:32px;z-index:5;text-align:right;color:var(--muted);font-size:15px;line-height:1.6}
body.poster #poster-foot b{display:block;font-family:var(--font-display);font-size:22px;color:var(--fg);letter-spacing:.06em}

/* phone layout */
@media (max-width:860px){
  #stats{left:12px;right:12px;max-width:none;padding:8px 10px;gap:0;flex-wrap:wrap;row-gap:4px}
  #stats .who{padding-right:10px;margin-right:2px}
  #stats .name{font-size:13px}
  #stats .stat{padding:0 7px}
  #stats .stat b{font-size:20px}
  #stats .stat .lab{font-size:11px}
  #rail{right:10px;top:auto;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:none;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px)}
  #rail button{width:42px;height:42px}
  #rail #b-list{display:flex}
  #legend{display:none}
  #panel{top:auto;right:0;left:0;bottom:0;width:auto;border-radius:16px 16px 0 0;height:48px;transition:height .25s ease;max-height:72%}
  #panel.open{height:70%}
  #panel .handle{display:flex;justify-content:center;align-items:center;gap:8px;height:48px;flex:none;color:var(--muted);font-size:13px;cursor:pointer}
  #panel .handle::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--panel-edge)}
  #panel .years{padding-top:4px}
  #tip{max-width:min(280px,calc(100vw - 24px))}
}
</style>

<div id="app">
  <svg id="map" role="img" aria-label="飞行航线图">
    <defs>
      <radialGradient id="apGlow">
        <stop offset="0" stop-color="#4fe4ff" stop-opacity=".55"/>
        <stop offset=".55" stop-color="#4fe4ff" stop-opacity=".16"/>
        <stop offset="1" stop-color="#4fe4ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="atmo" cx=".5" cy=".5" r=".5">
        <stop offset=".86" stop-color="#4fe4ff" stop-opacity="0"/>
        <stop offset="1" stop-color="#4fe4ff" stop-opacity=".25"/>
      </radialGradient>
    </defs>
  </svg>

  <header id="stats">
    <div class="who">
      <span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></span>
      <span class="name">飞行足迹<small id="s-range">—</small></span>
    </div>
    <div class="stat"><span class="lab">里程</span><b id="s-km">0</b><span class="unit">公里</span></div>
    <div class="stat"><span class="lab">次数</span><b id="s-n">0</b><span class="unit">次</span></div>
    <div class="stat"><span class="lab">国家/地区</span><b id="s-c">0</b><span class="unit">个</span></div>
    <div class="stat"><span class="lab">城市</span><b id="s-city">0</b><span class="unit">个</span></div>
    <div class="stat minor"><span class="lab">机场</span><b id="s-ap">0</b><span class="unit">个</span></div>
    <div class="stat minor"><span class="lab">时长</span><b id="s-h">0</b><span class="unit">小时</span></div>
  </header>

  <nav id="rail" aria-label="地图控制">
    <button id="b-mode" title="切换 2D / 3D 视图"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span>3D</span></button>
    <button id="b-anim" class="on" title="航线动画开关"><svg viewBox="0 0 24 24"><path d="M3 17c4-9 10-9 18-6"/><path d="M16 8l5 3-4 4"/></svg><span>动画</span></button>
    <button id="b-in" title="放大"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>放大</span></button>
    <button id="b-out" title="缩小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg><span>缩小</span></button>
    <button id="b-reset" title="回到全览"><svg viewBox="0 0 24 24"><path d="M4 10V4h6M20 14v6h-6"/><path d="M4 4l6 6M20 20l-6-6"/></svg><span>全览</span></button>
    <button id="b-export" title="导出当前视图为图片"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 5 5 3-3 5 5"/><circle cx="16" cy="9" r="1.5"/></svg><span>导出</span></button>
    <button id="b-list" title="航班列表"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>列表</span></button>
  </nav>

  <div id="legend"><span><i class="dot"></i>点的大小 = 到访次数</span><span><i class="ln"></i>线的粗细 = 飞行次数</span><span>滚轮缩放 · 拖拽平移 · 点击机场或航线筛选</span></div>

  <aside id="panel" aria-label="航班记录">
    <div class="handle" id="handle"><span id="handle-text">航班记录</span></div>
    <div class="years" id="years"></div>
    <div class="tabs" id="tabs">
      <button data-tab="flights" class="on">航班</button>
      <button data-tab="airports">机场</button>
      <button data-tab="airlines">航司</button>
    </div>
    <div class="filterbar" id="filterbar" hidden><span>筛选：<b id="filter-text"></b></span><button id="b-clear">清除</button></div>
    <div class="list" id="list"></div>
  </aside>

  <div id="poster-foot"><b id="pf-range">—</b>个人航班记录 · 大圆航线 · 点的大小为到访次数</div>

  <div id="tip" hidden></div>

  <div id="modal" hidden>
    <div class="box">
      <div class="bar"><span>航线图 PNG</span><button id="b-dl" class="dl" hidden>下载图片</button><button id="b-close" class="close">关闭</button></div>
      <img id="shot" alt="导出的航线图">
      <p class="hint" id="shot-hint">右键或长按图片即可保存。</p>
    </div>
  </div>
</div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson.min.js"></script>
<script>

const land = topojson.feature(WORLD, WORLD.objects.land);
const borders = topojson.mesh(WORLD, WORLD.objects.countries, (a,b) => a !== b);
const graticule = d3.geoGraticule().step([30,30])();
const countries = topojson.feature(WORLD, WORLD.objects.countries).features
  .filter(f => !/Antarctica|Fr\. S\. Antarctic/.test(f.properties.name))
  .map(f => ({ name: ZH[f.properties.name] || f.properties.name, c: LABEL_AT[f.properties.name] || d3.geoCentroid(f), area: d3.geoArea(f) }));
const CONTINENTS = [['亚洲',[92,46]],['欧洲',[14,55]],['非洲',[18,8]],['北美洲',[-103,47]],['南美洲',[-60,-14]],['大洋洲',[158,-30]]];

/* ---------- data derivations ---------- */
function yearOf(f){ return f.d.slice(0,4); }
function inYear(f){ return S.year === 'all' || yearOf(f) === S.year; }
function activeFlights(){ return FL.filter(inYear); }
function activePartial(){ return PARTIAL.filter(inYear); }

function buildRoutes(flights){
  const m = new Map();
  flights.forEach((f, i) => {
    const key = f.f < f.t ? f.f + '|' + f.t : f.t + '|' + f.f;
    let r = m.get(key);
    if (!r) {
      const a = [AP[f.f].lon, AP[f.f].lat], b = [AP[f.t].lon, AP[f.t].lat];
      // 2D copy: polar arcs are held at 80° so they stay inside a Mercator map instead of leaving through the top edge
      const ip = d3.geoInterpolate(a, b), N = 48, CAP = 80;
      const raw = d3.range(N + 1).map(i => ip(i / N)), pts = [];
      raw.forEach((p, i) => {
        const q = [p[0], Math.max(-CAP, Math.min(CAP, p[1]))];
        if (i > 0 && Math.abs(p[1]) > CAP && Math.abs(raw[i - 1][1]) > CAP) {
          // both ends capped: walk along the parallel in 2° steps so the capped stretch renders flat, not as great-circle bulges
          const l0 = pts[pts.length - 1][0]; let dl = q[0] - l0; if (dl > 180) dl -= 360; if (dl < -180) dl += 360;
          const steps = Math.ceil(Math.abs(dl) / 2);
          for (let s = 1; s < steps; s++) pts.push([l0 + dl * s / steps, q[1]]);
        }
        pts.push(q);
      });
      r = { key, a: f.f, b: f.t, n: 0, km: f.km, flights: [], line: { type: 'LineString', coordinates: [a, b] }, line2d: { type: 'LineString', coordinates: pts } };
      m.set(key, r);
    }
    r.n++; r.flights.push(f);
  });
  m.forEach(r => { r.w = Math.min(3.4, 0.9 + 0.5 * Math.sqrt(r.n)); });
  return [...m.values()];
}
function routeGeom(r){ return S.mode === '2d' ? r.line2d : r.line; }
function buildAirports(flights, partial){
  const m = new Map();
  const bump = (code, f) => { let a = m.get(code); if (!a) { a = Object.assign({ iata: code, n: 0, flights: [] }, AP[code]); m.set(code, a); } a.n++; a.flights.push(f); };
  flights.forEach(f => { bump(f.f, f); bump(f.t, f); });
  partial.forEach(f => { bump(f.f, f); });
  const list = [...m.values()].sort((a,b) => b.n - a.n || a.iata.localeCompare(b.iata));
  list.forEach((a, i) => { a.r = 2.2 + 1.15 * Math.sqrt(a.n); a.rank = i + 1; a.top = i === 0; });
  return list;
}
function computeStats(flights, partial){
  const km = d3.sum(flights, f => f.km), mins = d3.sum(flights, f => f.min);
  const codes = new Set(); flights.forEach(f => { codes.add(f.f); codes.add(f.t); }); partial.forEach(f => codes.add(f.f));
  const countries = new Set([...codes].map(c => AP[c].country));
  const cities = new Set([...codes].map(c => AP[c].country + '/' + AP[c].city));
  const airlines = new Set(flights.map(f => f.al));
  const dates = flights.map(f => f.d).concat(partial.map(f => f.d)).sort();
  return { km, n: flights.length, countries: countries.size, cities: cities.size, airports: codes.size, airlines: airlines.size, hours: mins / 60, first: dates[0], last: dates[dates.length - 1] };
}

let routes = [], airports = [];
function recompute(){
  const fl = activeFlights(), pa = activePartial();
  routes = buildRoutes(fl); airports = buildAirports(fl, pa);
  const st = computeStats(fl, pa);
  $('s-km').textContent = fmt(st.km); $('s-n').textContent = st.n; $('s-c').textContent = st.countries;
  $('s-city').textContent = st.cities; $('s-ap').textContent = st.airports; $('s-h').textContent = Math.round(st.hours);
  const range = st.first ? st.first.slice(0,7).replace('-', '.') + ' – ' + st.last.slice(0,7).replace('-', '.') : '—';
  $('s-range').textContent = range + (S.year === 'all' ? ' · 全部' : ' · ' + S.year + ' 年');
  $('pf-range').textContent = range;
}

/* ---------- svg scaffolding ---------- */
const svg = d3.select('#map');
const gRoot = svg.append('g').attr('class', 'root');
const gSphere = gRoot.append('g').attr('class', 'sphere-layer').style('display', 'none');
gSphere.append('path').attr('class', 'sphere');
gSphere.append('path').attr('class', 'graticule');
const gLand = gRoot.append('g');
gLand.append('path').attr('class', 'land');
gLand.append('path').attr('class', 'borders');
const gCont = gRoot.append('g');
const gCountry = gRoot.append('g');
const gRoutes = gRoot.append('g').attr('class', 'routes');
const gAp = gRoot.append('g');
const gEdge = gRoot.append('g').style('display', 'none');
gEdge.append('path').attr('class', 'sphere-edge');

gCont.selectAll('text').data(CONTINENTS).join('text').attr('class', 'continent').text(d => d[0]);
gCountry.selectAll('text').data(countries).join('text').attr('class', 'country').text(d => d.name);

const proj2 = d3.geoMercator();
const proj3 = d3.geoOrthographic().clipAngle(90).rotate([-60, -30]);
let proj = proj2, path = d3.geoPath(proj);
let W = 0, H = 0, R0 = 0, clip2 = null;

function pads(){
  const narrow = window.innerWidth <= 860;
  if (POSTER) return { t: 170, r: 60, b: 90, l: 60 };
  return { t: narrow ? 120 : 110, r: narrow ? 20 : 440, b: narrow ? 90 : 60, l: 20 };
}
function fitFeature(){
  const fc = { type: 'FeatureCollection', features: buildRoutes(FL).map(r => ({ type: 'Feature', geometry: r.line2d })).concat(Object.keys(AP).map(c => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [AP[c].lon, AP[c].lat] } }))) };
  return fc;
}
function layout(){
  const rect = svg.node().getBoundingClientRect();
  W = Math.max(320, rect.width); H = Math.max(320, rect.height);
  const p = pads();
  proj2.clipExtent(null).fitExtent([[p.l, p.t], [W - p.r, H - p.b]], fitFeature());
  const x0 = proj2([-180, 0])[0], x1 = proj2([180, 0])[0], y0 = proj2([0, 84])[1], y1 = proj2([0, -60])[1];
  clip2 = [[x0, y0], [x1, y1]];
  proj2.clipExtent(clip2);
  zoom2.translateExtent([[x0 - W * 0.6, y0 - H * 0.6], [x1 + W * 0.6, y1 + H * 0.6]]);
  const fw = W - p.l - p.r, fh = H - p.t - p.b;          // free area beside the panel and below the stat strip
  R0 = Math.min(fw, fh + 60) / 2.15;
  proj3.translate([p.l + fw / 2, p.t + fh / 2]);
  if (!proj3.scale() || proj3.scale() === 150) proj3.scale(R0);
}

/* ---------- drawing ---------- */
function drawStatic(){
  gRoutes.selectAll('g.r').data(routes, d => d.key).join(enter => {
    const g = enter.append('g').attr('class', 'r');
    g.append('path').attr('class', 'route-glow');
    g.append('path').attr('class', 'route');
    g.append('path').attr('class', 'flow');
    g.append('path').attr('class', 'hit');
    g.on('pointerenter', (e, d) => showTip(e, routeTip(d))).on('pointermove', moveTip).on('pointerleave', hideTip)
     .on('click', (e, d) => { e.stopPropagation(); select({ type: 'route', key: d.key }); });
    return g;
  });
  gAp.selectAll('g.ap').data(airports, d => d.iata).join(enter => {
    const g = enter.append('g').attr('class', 'ap');
    g.append('circle').attr('class', 'halo');
    g.append('circle').attr('class', 'pulse');
    g.append('circle').attr('class', 'core');
    const t = g.append('text');
    t.append('tspan').attr('class', 'iata');
    t.append('tspan').attr('class', 'city').attr('dx', 4);
    g.on('pointerenter', (e, d) => showTip(e, apTip(d))).on('pointermove', moveTip).on('pointerleave', hideTip)
     .on('click', (e, d) => { e.stopPropagation(); select({ type: 'ap', id: d.iata }); });
    return g;
  });
  gAp.selectAll('g.ap').sort((a, b) => b.n - a.n);
  gAp.selectAll('g.ap').select('.pulse').style('display', d => d.top ? null : 'none');
  gAp.selectAll('g.ap').select('.iata').text(d => d.iata);
  gAp.selectAll('g.ap').select('.city').text(d => d.city);
  applySelection();
}

function visibleOnGlobe(lonlat){
  if (S.mode === '2d') return true;
  const r = proj3.rotate();
  return d3.geoDistance(lonlat, [-r[0], -r[1]]) < Math.PI / 2 - 0.02;
}
function updateGeometry(){
  gLand.select('.land').attr('d', path(land));
  gLand.select('.borders').attr('d', path(borders));
  if (S.mode === '3d') {
    gSphere.select('.sphere').attr('d', path({ type: 'Sphere' }));
    gSphere.select('.graticule').attr('d', path(graticule));
    gEdge.select('.sphere-edge').attr('d', path({ type: 'Sphere' }));
  }
  gRoutes.selectAll('g.r').each(function(d){ const dd = path(routeGeom(d)) || ''; d3.select(this).selectAll('path').attr('d', dd); });
  gAp.selectAll('g.ap').each(function(d){
    const p = proj([d.lon, d.lat]);
    const vis = p && visibleOnGlobe([d.lon, d.lat]);
    d3.select(this).style('display', vis ? null : 'none').attr('transform', vis ? 'translate(' + p[0] + ',' + p[1] + ')' : null);
  });
  gCountry.selectAll('text').each(function(d){
    const p = proj(d.c); const vis = p && visibleOnGlobe(d.c);
    d3.select(this).attr('x', vis ? p[0] : -9999).attr('y', vis ? p[1] : -9999).attr('data-vis', vis ? 1 : 0);
  });
  gCont.selectAll('text').each(function(d){
    const p = proj(d[1]); const vis = p && visibleOnGlobe(d[1]);
    d3.select(this).attr('x', vis ? p[0] : -9999).attr('y', vis ? p[1] : -9999).attr('data-vis', vis ? 1 : 0);
  });
}
/* perceived zoom: map radius in px relative to a 260px reference, so label density follows the real on-screen scale (phone vs desktop vs globe) */
function effK(){ const sc = S.mode === '2d' ? proj2.scale() * S.t.k : proj3.scale(); return sc / 260; }
function labelMin(k){ if (POSTER) return 2; return k < 1.6 ? 6 : k < 2.6 ? 3 : k < 4 ? 2 : 1; }
/* greedy label placement: hubs first; try right, left, above, below; hide when every spot collides with a dot or another label */
function placeLabels(){
  const k = S.mode === '2d' ? S.t.k : 1, z = effK(), min = labelMin(z), fs = 11.5;
  const boxes = [], nodes = [];
  gAp.selectAll('g.ap').each(function(d){
    if (this.style.display === 'none') return;
    const p = proj([d.lon, d.lat]); if (!p) return;
    const sx = S.mode === '2d' ? S.t.applyX(p[0]) : p[0], sy = S.mode === '2d' ? S.t.applyY(p[1]) : p[1];
    boxes.push([sx - d.r, sy - d.r, sx + d.r, sy + d.r]);
    nodes.push({ d, el: this, sx, sy });
  });
  nodes.sort((a, b) => b.d.n - a.d.n);
  const hits = b => boxes.some(o => o[0] < b[2] && b[0] < o[2] && o[1] < b[3] && b[1] < o[3]);
  nodes.forEach(({ d, el, sx, sy }) => {
    const t = d3.select(el).select('text');
    if (d.n < min) { t.style('display', 'none'); return; }
    const w = d.iata.length * fs * 0.62 + 4 + d.city.length * fs * 1.02 + 2, h = fs * 1.25, r = d.r;
    const cands = [[r + 4, 0, 'start'], [-(r + 4), 0, 'end'], [0, -(r + 5), 'middle'], [0, r + 5, 'middle']];
    let ok = null;
    for (const [dx, dy, anchor] of cands) {
      const x0 = anchor === 'start' ? sx + dx : anchor === 'end' ? sx + dx - w : sx - w / 2;
      const y0 = anchor === 'middle' ? (dy < 0 ? sy + dy - h : sy + dy) : sy - h / 2;
      const box = [x0, y0, x0 + w, y0 + h];
      if (!hits(box)) { ok = { dx, dy, anchor, box }; break; }
    }
    if (!ok) { t.style('display', 'none'); return; }
    boxes.push(ok.box);
    t.style('display', null).attr('text-anchor', ok.anchor).attr('x', ok.dx / k).attr('y', ok.dy / k)
     .attr('dy', ok.anchor === 'middle' ? (ok.dy < 0 ? '0' : '.9em') : '.36em').attr('font-size', fs / k);
  });
}
function applyScale(){
  const k = S.mode === '2d' ? S.t.k : 1;            // geometric scale applied through the transform
  const z = effK();                                  // perceived zoom level
  gLand.select('.borders').attr('stroke-width', 0.6 / k);
  gRoutes.selectAll('g.r').each(function(d){
    const g = d3.select(this);
    g.select('.route').attr('stroke-width', d.w / k);
    g.select('.route-glow').attr('stroke-width', (d.w * 3.2) / k);
    g.select('.flow').attr('stroke-width', (d.w * 0.95) / k).attr('stroke-dasharray', (7 / k) + ' ' + (15 / k));
    g.select('.hit').attr('stroke-width', 12 / k);
  });
  const min = labelMin(z);
  gAp.selectAll('g.ap').each(function(d){
    const g = d3.select(this);
    g.select('.core').attr('r', d.r / k).attr('stroke-width', 1 / k);
    g.select('.halo').attr('r', (d.r * 3) / k);
    g.select('.pulse').attr('r', (d.r * 1.3) / k).attr('stroke-width', 1.2 / k);
  });
  placeLabels();
  const th = 0.0045 / (z * z);
  gCountry.selectAll('text').attr('font-size', 10.5 / k).style('display', function(d){ return (d.area > th && this.getAttribute('data-vis') === '1') ? null : 'none'; });
  gCont.selectAll('text').attr('font-size', 22 / k).style('display', function(){ return (z < 2.2 && this.getAttribute('data-vis') === '1') ? null : 'none'; });
}
function render(){ updateGeometry(); applyScale(); }

/* ---------- zoom / rotate ---------- */
const zoom2 = d3.zoom().scaleExtent([0.7, 90]).on('start', () => svg.classed('dragging', true)).on('end', () => svg.classed('dragging', false))
  .on('zoom', e => { S.t = e.transform; gRoot.attr('transform', S.t); applyScale(); });
const zoom3 = d3.zoom().scaleExtent([0.6, 9]).filter(e => e.type === 'wheel' || (e.touches && e.touches.length > 1))
  .on('zoom', e => { proj3.scale(R0 * e.transform.k); render(); });
let autoTimer = null;
function stopAuto(){ S.auto = false; if (autoTimer) { autoTimer.stop(); autoTimer = null; } }
const drag3 = d3.drag().on('start', e => { stopAuto(); S.v0 = [e.x, e.y]; S.r0 = proj3.rotate(); svg.classed('dragging', true); })
  .on('drag', e => { const sens = 60 / proj3.scale(); const r = [S.r0[0] + (e.x - S.v0[0]) * sens, Math.max(-85, Math.min(85, S.r0[1] - (e.y - S.v0[1]) * sens))]; proj3.rotate(r); render(); })
  .on('end', () => svg.classed('dragging', false));

function attachBehaviors(){
  svg.on('.zoom', null).on('.drag', null);
  if (S.mode === '2d') { svg.call(zoom2); svg.on('dblclick.zoom', null); }
  else { svg.call(zoom3).call(drag3); svg.on('dblclick.zoom', null); }
}
function setMode(mode){
  S.mode = mode; proj = mode === '2d' ? proj2 : proj3; path = d3.geoPath(proj);
  gSphere.style('display', mode === '3d' ? null : 'none'); gEdge.style('display', mode === '3d' ? null : 'none');
  $('b-mode').querySelector('span').textContent = mode === '2d' ? '3D' : '2D';
  $('b-mode').classList.toggle('on', mode === '3d');
  if (mode === '2d') { gRoot.attr('transform', S.t); }
  else { gRoot.attr('transform', null); S.auto = true; startAuto(); }
  attachBehaviors(); render();
}
function startAuto(){
  if (reduced || autoTimer || !S.auto) return;
  let last = null;
  autoTimer = d3.timer(t => { if (last != null) { const r = proj3.rotate(); proj3.rotate([r[0] + (t - last) * 0.006, r[1]]); render(); } last = t; });
}
function resetView(){
  if (S.mode === '2d') svg.transition().duration(650).call(zoom2.transform, d3.zoomIdentity);
  else { proj3.scale(R0); d3.transition().duration(650).tween('rot', () => { const i = d3.interpolate(proj3.rotate(), [-60, -30]); return t => { proj3.rotate(i(t)); render(); }; }); svg.call(zoom3.transform, d3.zoomIdentity); }
}
function zoomBy(f){
  if (S.mode === '2d') svg.transition().duration(300).call(zoom2.scaleBy, f);
  else { stopAuto(); svg.transition().duration(300).call(zoom3.scaleBy, f); }
}
function focusRoute(r){
  stopAuto();
  if (S.mode === '2d') {
    const b = d3.geoPath(proj2).bounds({ type: 'Feature', geometry: r.line2d });
    const dx = Math.max(40, b[1][0] - b[0][0]), dy = Math.max(40, b[1][1] - b[0][1]);
    const p = pads();
    const vw = W - p.l - p.r, vh = H - p.t - p.b;
    const k = Math.max(0.7, Math.min(12, 0.75 / Math.max(dx / vw, dy / vh)));
    const cx = (b[0][0] + b[1][0]) / 2, cy = (b[0][1] + b[1][1]) / 2;
    const t = d3.zoomIdentity.translate(p.l + vw / 2 - cx * k, p.t + vh / 2 - cy * k).scale(k);
    svg.transition().duration(750).call(zoom2.transform, t);
  } else {
    const mid = d3.geoInterpolate(r.line.coordinates[0], r.line.coordinates[1])(0.5);
    d3.transition().duration(750).tween('rot', () => { const i = d3.interpolate(proj3.rotate(), [-mid[0], -mid[1]]); return t => { proj3.rotate(i(t)); render(); }; });
  }
}
function focusAirport(a){
  stopAuto();
  if (S.mode === '2d') {
    const p = proj2([a.lon, a.lat]); const pd = pads(); const vw = W - pd.l - pd.r, vh = H - pd.t - pd.b;
    const k = Math.max(S.t.k, 3);
    svg.transition().duration(750).call(zoom2.transform, d3.zoomIdentity.translate(pd.l + vw / 2 - p[0] * k, pd.t + vh / 2 - p[1] * k).scale(k));
  } else {
    d3.transition().duration(750).tween('rot', () => { const i = d3.interpolate(proj3.rotate(), [-a.lon, -a.lat]); return t => { proj3.rotate(i(t)); render(); }; });
  }
}

/* ---------- flow animation ---------- */
let flowTimer = null;
function startFlow(){
  if (flowTimer) return;
  flowTimer = d3.timer(t => {
    const k = S.mode === '2d' ? S.t.k : 1; const period = 22 / k;
    gRoutes.selectAll('.flow').attr('stroke-dashoffset', -((t * 0.03) % period) * 1);
  });
}
function stopFlow(){ if (flowTimer) { flowTimer.stop(); flowTimer = null; } }
function setAnim(on){
  S.anim = on; document.body.classList.toggle('no-anim', !on); $('b-anim').classList.toggle('on', on);
  if (on) startFlow(); else stopFlow();
}

/* ---------- selection ---------- */
function select(sel){ S.sel = (S.sel && sel && S.sel.type === sel.type && (S.sel.id === sel.id && S.sel.key === sel.key)) ? null : sel; applySelection(); renderList(); }
function clearSel(){ if (S.sel) { S.sel = null; applySelection(); renderList(); } }
function routeMatches(r){
  if (!S.sel) return true;
  if (S.sel.type === 'route') return r.key === S.sel.key;
  return r.a === S.sel.id || r.b === S.sel.id;
}
function apMatches(a){
  if (!S.sel) return true;
  if (S.sel.type === 'route') return S.sel.key.split('|').includes(a.iata);
  if (a.iata === S.sel.id) return true;
  return routes.some(r => (r.a === S.sel.id && r.b === a.iata) || (r.b === S.sel.id && r.a === a.iata));
}
function applySelection(){
  gRoutes.selectAll('g.r').classed('dim', d => !routeMatches(d)).classed('sel', d => !!S.sel && S.sel.type === 'route' && d.key === S.sel.key);
  gAp.selectAll('g.ap').classed('dim', d => !apMatches(d));
  const fb = $('filterbar');
  if (S.sel) {
    fb.hidden = false;
    $('filter-text').textContent = S.sel.type === 'ap' ? (S.sel.id + ' ' + AP[S.sel.id].city + ' 相关航班') : S.sel.key.replace('|', ' ⇄ ') + ' 航线';
  } else fb.hidden = true;
}
function flightMatches(f){
  if (!S.sel) return true;
  if (S.sel.type === 'route') { const [a, b] = S.sel.key.split('|'); return (f.f === a && f.t === b) || (f.f === b && f.t === a); }
  return f.f === S.sel.id || f.t === S.sel.id;
}

/* ---------- tooltip ---------- */
const tip = $('tip');
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function flightsUl(list, limit){
  const sorted = list.slice().sort((a, b) => b.d.localeCompare(a.d));
  const shown = sorted.slice(0, limit);
  let h = '<ul>' + shown.map(f => '<li><span>' + f.d.slice(2).replace(/-/g, '.') + '</span>' + esc(f.f) + '→' + esc(f.t || '?') + '<em>' + esc(f.no) + '</em></li>').join('') + '</ul>';
  if (sorted.length > limit) h += '<div style="font-size:11px;color:var(--dim);margin-top:3px">… 还有 ' + (sorted.length - limit) + ' 段</div>';
  return h;
}
function apTip(a){
  return '<h4><b>' + esc(a.iata) + '</b>' + esc(a.name) + '</h4><div>' + esc(a.nameEn) + ' · ' + esc(a.city) + '，' + esc(a.country) + '</div>' +
    '<div class="kv">' + a.n + ' <span>次到访</span> ' + '#' + a.rank + ' <span>常去排名</span></div>' + flightsUl(a.flights, 6);
}
function routeTip(r){
  const A = AP[r.a], B = AP[r.b];
  return '<h4><b>' + esc(r.a) + ' ⇄ ' + esc(r.b) + '</b></h4><div>' + esc(A.city) + ' ⇄ ' + esc(B.city) + '</div>' +
    '<div class="kv">' + r.n + ' <span>次飞行</span> ' + fmt(r.km) + ' <span>公里 / 段</span></div>' + flightsUl(r.flights, 6);
}
function showTip(e, html){ tip.innerHTML = html; tip.hidden = false; moveTip(e); }
function moveTip(e){
  const app = $('app').getBoundingClientRect();
  let x = e.clientX - app.left + 16, y = e.clientY - app.top + 16;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > app.width - 8) x = e.clientX - app.left - w - 12;
  if (y + h > app.height - 8) y = e.clientY - app.top - h - 12;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip(){ tip.hidden = true; }

/* ---------- panel ---------- */
function renderYears(){
  const years = [...new Set(FL.map(yearOf).concat(PARTIAL.map(yearOf)))].sort();
  const box = $('years'); box.innerHTML = '';
  [['all', '全部']].concat(years.map(y => [y, y])).forEach(([v, label]) => {
    const b = document.createElement('button'); b.textContent = label; b.dataset.year = v; b.classList.toggle('on', S.year === v);
    b.addEventListener('click', () => { S.year = v; box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); S.sel = null; recompute(); drawStatic(); render(); renderList(); });
    box.appendChild(b);
  });
}
function dur(min){ return Math.floor(min / 60) + 'h' + String(min % 60).padStart(2, '0') + 'm'; }
function renderList(){
  const list = $('list'); let h = '';
  if (S.tab === 'flights') {
    const fl = activeFlights().filter(flightMatches).concat(activePartial().filter(flightMatches)).sort((a, b) => b.d.localeCompare(a.d) || (b.dep || '').localeCompare(a.dep || ''));
    const byYear = d3.group(fl, yearOf);
    [...byYear.keys()].sort().reverse().forEach(y => {
      const rows = byYear.get(y); const km = d3.sum(rows, f => f.km || 0);
      h += '<div class="yh">' + y + '<small>' + rows.length + ' 段 · ' + fmt(km) + ' 公里</small></div>';
      rows.forEach(f => {
        const key = f.t ? (f.f < f.t ? f.f + '|' + f.t : f.t + '|' + f.f) : '';
        const on = S.sel && S.sel.type === 'route' && S.sel.key === key;
        h += '<div class="row' + (on ? ' on' : '') + '" data-key="' + key + '">' +
          '<div class="date">' + f.d.slice(5) + '<small>' + f.d.slice(0, 4) + '</small></div>' +
          '<div class="main"><div class="l1">' + esc(f.f) + '<span class="arr">→</span>' + (f.t ? esc(f.t) : '<span class="badge gray">记录不完整</span>') + '<span class="fn">' + esc(f.no) + '</span>' + (f.q ? '<span class="badge" title="同一时段有两条行程记录，其中一条可能未实际乘坐">存疑</span>' : '') + '</div>' +
          '<div class="l2">' + esc(AP[f.f].city) + (f.t ? ' → ' + esc(AP[f.t].city) : ' → 目的地未知') + ' · ' + esc(f.al) + '</div></div>' +
          '<div class="meta">' + (f.km ? '<b>' + fmt(f.km) + ' km</b>' : '') + (f.min ? dur(f.min) : '') + '</div></div>';
      });
    });
    if (!fl.length) h = '<div class="empty">没有符合条件的航班</div>';
  } else if (S.tab === 'airports') {
    const max = airports.length ? airports[0].n : 1;
    airports.forEach(a => {
      const on = S.sel && S.sel.type === 'ap' && S.sel.id === a.iata;
      h += '<div class="rk' + (on ? ' on' : '') + '" data-ap="' + a.iata + '"><div class="n">' + a.rank + '</div>' +
        '<div class="main"><div class="t"><b>' + esc(a.iata) + '</b><span>' + esc(a.name) + '</span></div><div class="s">' + esc(a.city) + ' · ' + esc(a.country) + ' · ' + esc(a.nameEn) + '</div>' +
        '<div class="bar"><i style="width:' + (100 * a.n / max) + '%"></i></div></div>' +
        '<div class="v">' + a.n + '<small>次到访</small></div></div>';
    });
  } else {
    const fl = activeFlights();
    const rows = [...d3.rollup(fl, v => ({ n: v.length, km: d3.sum(v, f => f.km) }), f => f.al)].map(([al, s]) => ({ al, ...s })).sort((a, b) => b.n - a.n || b.km - a.km);
    const max = rows.length ? rows[0].n : 1;
    rows.forEach((r, i) => {
      h += '<div class="rk" data-al="' + esc(r.al) + '"><div class="n">' + (i + 1) + '</div>' +
        '<div class="main"><div class="t"><span>' + esc(r.al) + '</span></div><div class="s">' + fmt(r.km) + ' 公里</div>' +
        '<div class="bar"><i style="width:' + (100 * r.n / max) + '%"></i></div></div>' +
        '<div class="v">' + r.n + '<small>次飞行</small></div></div>';
    });
    if (!rows.length) h = '<div class="empty">没有符合条件的航班</div>';
  }
  list.innerHTML = h;
  $('handle-text').textContent = (S.tab === 'flights' ? '航班记录' : S.tab === 'airports' ? '机场排行' : '航司排行') + ' · ' + (S.year === 'all' ? '全部' : S.year + ' 年');
}
$('list').addEventListener('click', e => {
  const row = e.target.closest('.row'); const rk = e.target.closest('.rk');
  if (row && row.dataset.key) { const r = routes.find(x => x.key === row.dataset.key); if (r) { S.sel = { type: 'route', key: r.key }; applySelection(); renderList(); focusRoute(r); } }
  else if (rk && rk.dataset.ap) { const a = airports.find(x => x.iata === rk.dataset.ap); if (a) { S.sel = { type: 'ap', id: a.iata }; applySelection(); renderList(); focusAirport(a); } }
});
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.tab = b.dataset.tab; $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderList();
});
$('b-clear').addEventListener('click', clearSel);
$('handle').addEventListener('click', () => $('panel').classList.toggle('open'));
$('b-list').addEventListener('click', () => $('panel').classList.toggle('open'));

/* ---------- rail ---------- */
$('b-mode').addEventListener('click', () => setMode(S.mode === '2d' ? '3d' : '2d'));
$('b-anim').addEventListener('click', () => setAnim(!S.anim));
$('b-in').addEventListener('click', () => zoomBy(1.6));
$('b-out').addEventListener('click', () => zoomBy(1 / 1.6));
$('b-reset').addEventListener('click', resetView);
$('b-export').addEventListener('click', exportPNG);
$('b-close').addEventListener('click', () => { $('modal').hidden = true; });
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').hidden = true; });
svg.on('click', () => clearSel());

/* ---------- PNG export (canvas renderer) ---------- */
function exportPNG(){
  const s = Math.max(2, Math.min(3, Math.floor(4096 / W)));
  const c = document.createElement('canvas'); c.width = Math.round(W * s); c.height = Math.round(H * s);
  const ctx = c.getContext('2d'); ctx.scale(s, s);
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue(n).trim();
  const body = '"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif', disp = '"Rajdhani",' + body;
  ctx.fillStyle = v('--bg'); ctx.fillRect(0, 0, W, H);
  const cp = d3.geoPath(proj, ctx);
  const k = S.mode === '2d' ? S.t.k : 1, z = effK();
  ctx.save();
  if (S.mode === '2d') { ctx.translate(S.t.x, S.t.y); ctx.scale(k, k); }
  else { ctx.beginPath(); cp({ type: 'Sphere' }); ctx.fillStyle = v('--sphere'); ctx.fill(); ctx.beginPath(); cp(graticule); ctx.strokeStyle = v('--graticule'); ctx.lineWidth = .5; ctx.stroke(); }
  ctx.beginPath(); cp(land); ctx.fillStyle = v('--land'); ctx.fill();
  ctx.beginPath(); cp(borders); ctx.strokeStyle = v('--land-edge'); ctx.lineWidth = .6 / k; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const th = 0.0045 / (z * z);
  ctx.font = '500 ' + (10.5 / k) + 'px ' + body;
  countries.forEach(d => { if (d.area <= th || !visibleOnGlobe(d.c)) return; const p = proj(d.c); if (!p) return; ctx.lineWidth = 2.5 / k; ctx.strokeStyle = 'rgba(6,18,34,.75)'; ctx.strokeText(d.name, p[0], p[1]); ctx.fillStyle = v('--muted'); ctx.fillText(d.name, p[0], p[1]); });
  if (z < 2.2) { ctx.font = '700 ' + (22 / k) + 'px ' + body; ctx.fillStyle = 'rgba(142,169,201,.5)'; CONTINENTS.forEach(d => { if (!visibleOnGlobe(d[1])) return; const p = proj(d[1]); if (p) ctx.fillText(d[0].split('').join('  '), p[0], p[1]); }); }
  ctx.lineCap = 'round';
  routes.forEach(r => {
    const dim = !routeMatches(r);
    ctx.beginPath(); cp(routeGeom(r)); ctx.strokeStyle = v('--accent'); ctx.globalAlpha = dim ? .03 : .14; ctx.lineWidth = r.w * 3.2 / k; ctx.stroke();
    ctx.globalAlpha = dim ? .1 : .78; ctx.lineWidth = r.w / k; ctx.stroke();
  });
  ctx.globalAlpha = 1;
  gAp.selectAll('g.ap').each(function(a){
    if (this.style.display === 'none') return; const p = proj([a.lon, a.lat]); if (!p) return;
    ctx.globalAlpha = apMatches(a) ? 1 : .22;
    const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], a.r * 3 / k);
    g.addColorStop(0, 'rgba(79,228,255,.55)'); g.addColorStop(.55, 'rgba(79,228,255,.16)'); g.addColorStop(1, 'rgba(79,228,255,0)');
    ctx.beginPath(); ctx.arc(p[0], p[1], a.r * 3 / k, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); ctx.arc(p[0], p[1], a.r / k, 0, Math.PI * 2); ctx.fillStyle = v('--accent-strong'); ctx.fill(); ctx.strokeStyle = v('--accent'); ctx.lineWidth = 1 / k; ctx.stroke();
    const t = this.querySelector('text');
    if (t && t.style.display !== 'none') {           // reuse the label slot chosen for the on-screen map
      const anchor = t.getAttribute('text-anchor') || 'start', dy = t.getAttribute('dy') || '.36em';
      const x = p[0] + (+t.getAttribute('x') || 0), y = p[1] + (+t.getAttribute('y') || 0);
      ctx.textAlign = anchor === 'middle' ? 'center' : anchor === 'end' ? 'right' : 'left';
      ctx.textBaseline = dy === '0' ? 'alphabetic' : dy === '.9em' ? 'top' : 'middle';
      ctx.font = '700 ' + (11.5 / k) + 'px ' + disp; ctx.lineWidth = 3 / k; ctx.strokeStyle = 'rgba(6,18,34,.9)';
      const s = a.iata + ' ' + a.city; ctx.strokeText(s, x, y); ctx.fillStyle = v('--fg'); ctx.fillText(s, x, y);
      ctx.textBaseline = 'middle';
    }
  });
  ctx.restore(); ctx.globalAlpha = 1;
  // header
  const st = computeStats(activeFlights(), activePartial());
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 22px ' + body; ctx.fillStyle = v('--fg'); ctx.fillText('飞行足迹', 28, 44);
  ctx.font = '400 12px ' + body; ctx.fillStyle = v('--muted'); ctx.fillText($('s-range').textContent, 28, 62);
  let x = 28; const items = [['里程', fmt(st.km), '公里'], ['次数', st.n, '次'], ['国家/地区', st.countries, '个'], ['城市', st.cities, '个'], ['机场', st.airports, '个']];
  items.forEach(([lab, val, unit]) => {
    ctx.font = '400 12px ' + body; ctx.fillStyle = v('--muted'); ctx.fillText(lab, x, 98); x += ctx.measureText(lab).width + 6;
    ctx.font = '700 30px ' + disp; ctx.fillStyle = v('--accent'); ctx.fillText(String(val), x, 100); x += ctx.measureText(String(val)).width + 4;
    ctx.font = '400 12px ' + body; ctx.fillStyle = v('--muted'); ctx.fillText(unit, x, 98); x += ctx.measureText(unit).width + 26;
  });
  ctx.textAlign = 'right'; ctx.font = '400 11px ' + body; ctx.fillStyle = v('--dim'); ctx.fillText('个人航班记录 · 大圆航线 · 点的大小为到访次数', W - 20, H - 16);
  $('shot').src = c.toDataURL('image/png');
  lastShot = null; c.toBlob(b => { lastShot = b; }, 'image/png');
  $('shot-hint').textContent = '右键 / 长按图片即可保存。导出尺寸 ' + c.width + ' × ' + c.height + ' 像素。';
  $('b-dl').hidden = true;
  $('modal').hidden = false;
  downloadsP.then(dl => { $('b-dl').hidden = !(dl || LOCAL_SAVE); });
}
/* saving: the claude.ai viewer hands the file over through the downloads capability; the standalone copy of this page gets a plain anchor injected at build time */
const LOCAL_SAVE = function(b){ var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.setAttribute('download','飞行足迹.png'); document.body.appendChild(a); a.click(); a.remove(); };
let lastShot = null;
const downloadsP = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve().then(() => window.claude.use('downloads')).catch(() => null) : Promise.resolve(null);
async function saveShot(){
  if (!lastShot) return;
  const dl = await downloadsP;
  if (dl) {
    try { await dl.save({ filename: '飞行足迹.png', data: lastShot }); $('shot-hint').textContent = '已保存。'; }
    catch (e) { if (!e || e.code !== 'declined') $('shot-hint').textContent = '保存未完成，可右键 / 长按图片保存。'; }
    return;
  }
  if (LOCAL_SAVE) LOCAL_SAVE(lastShot);
}
$('b-dl').addEventListener('click', saveShot);

/* ---------- boot ---------- */
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { layout(); if (S.mode === '2d') { S.t = d3.zoomIdentity; svg.call(zoom2.transform, d3.zoomIdentity); } render(); }, 150); });
recompute(); renderYears(); layout(); drawStatic(); attachBehaviors(); render(); renderList();
if (S.anim) startFlow();
})();
</script>
