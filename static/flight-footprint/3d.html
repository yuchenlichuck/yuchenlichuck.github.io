/* Layout: satellite globe fills the screen; a transparent WebGL canvas renders the 3D aircraft at the camera target; a 2D canvas on top draws pins, photo cards and the HUD (so a recording captures exactly what is on screen); one control bar floats at the bottom. */
:root{

  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}

button,select{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

#controls button:hover{color:var(--fg);border-color:var(--panel-edge)}

#controls #b-rec.on i{animation:blink 1s steps(2) infinite}
#controls i.dot{width:9px;height:9px;border-radius:50%;background:#ff4d4d;display:inline-block}
@keyframes blink{to{opacity:.2}}
#controls .sep{width:1px;height:24px;background:var(--panel-edge);margin:0 2px}

#toast{position:absolute;left:50%;top:max(18px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;padding:9px 14px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:10px;font-size:13px;color:var(--fg);box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
#hint{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top,0px));z-index:5;font-size:11px;color:var(--dim);text-align:right;line-height:1.5;pointer-events:none}

@media (max-width:640px){
  #controls{gap:4px;padding:6px 8px;border-radius:12px}
  #controls button,#controls select{height:36px;padding:0 9px;font-size:12px}
  #controls #b-play{min-width:80px}
  #controls .txt{display:none}
  #hint{display:none}
}

body.is-embed #controls{opacity:0;pointer-events:none;transition:opacity .2s ease}
body.is-embed:hover #controls{opacity:1;pointer-events:auto}

/* ---------- sequence ---------- */

  steps.push({ type: 'intro', to: fl[0].a, dur: 4.2, flight: fl[0] });
  fl.forEach((f, i) => {
    if (i > 0 && fl[i - 1].t !== f.f) steps.push({ type: 'transit', from: fl[i - 1].b, to: f.a, dur: 1.8, flight: f, prev: fl[i - 1] });

    seen.add(cityKey(f.f)); seen.add(cityKey(f.t));

    const h0 = newFrom && PHOTOS[cityKey(f.f)] ? HOLD_NEW : HOLD, h1 = newTo && PHOTOS[cityKey(f.t)] ? HOLD_NEW : HOLD;

}

  routesFC = { type: 'FeatureCollection', features: [] }; visitedFC = { type: 'FeatureCollection', features: [] }; visitedSet = new Set();
  map.getSource('routes').setData(empty); map.getSource('live').setData(empty); map.getSource('visited').setData(empty);
}

/* ---------- per-frame scene ---------- */
let cam = { center: [60, 30], zoom: 1.2, pitch: 0 };

let targetHdg = 0;
function stepView(step, t){

    const e = ease(clamp((t - 1.2) / (step.dur - 1.2), 0, 1));
    const f = step.flight;
    cam = { center: slerp([step.to[0] - 10, step.to[1] - 16], step.to, e), zoom: 1.2 + (Z.ap - 1.2) * e, pitch: Z.pitch0 * e };
    targetHdg = along(f, 0).hdg;
    if (e > .55) { labels.push({ at: f.a, code: f.f, a: (e - .55) / .45 }); plane = { pos: f.a, hdg: targetHdg, alt: 0, climb: 0, bank: 0 }; }

    targetHdg = along(step.flight, 0).hdg;

/* ---------- playback ---------- */
let rafId = null, last = null;
function loop(now){ rafId = requestAnimationFrame(loop); const dt = last == null ? 0 : Math.min(0.1, (now - last) / 1000); last = now; frame(dt || 1e-4); }
function play(){ if (S.playing) return; S.playing = true; setInteractive(false); $('play-text').textContent = '暂停'; $('ic-play').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'; last = null; }
let pause = function(){ S.playing = false; setInteractive(true); $('play-text').textContent = '播放'; $('ic-play').innerHTML = '<path d="M8 5v14l11-7z"/>'; };
function nextFlightIdx(dir){ let i = S.idx + dir; while (i >= 0 && i < S.steps.length && S.steps[i].type !== 'flight') i += dir; return clamp(i, 0, S.steps.length - 1); }
$('b-play').addEventListener('click', () => { if (S.idx === S.steps.length - 1 && S.t >= S.steps[S.idx].dur) gotoStep(0); S.playing ? pause() : play(); });
$('b-next').addEventListener('click', () => gotoStep(nextFlightIdx(1)));

$('b-restart').addEventListener('click', () => { gotoStep(0); play(); });
$('b-view').addEventListener('click', () => { S.chase = !S.chase; $('view-text').textContent = S.chase ? '跟随镜头' : '正北镜头'; $('b-view').classList.toggle('on', S.chase); });
$('speed').addEventListener('change', e => { S.speed = +e.target.value; });
const ysel = $('year'); [['all', '全部年份']].concat(YEARS.map(y => [y, y + ' 年'])).forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; ysel.appendChild(o); });
ysel.addEventListener('change', e => { S.year = e.target.value; rebuild(); play(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('b-play').click(); }
  else if (e.code === 'ArrowRight') $('b-next').click();
  else if (e.code === 'ArrowLeft') $('b-prev').click();

let toastT = null;
function toast(msg, ms){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); if (ms) toastT = setTimeout(() => { t.hidden = true; }, ms); }

/* ---------- recording: composite of globe, aircraft and overlay, saved as a video file ---------- */
const downloadsP = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve().then(() => window.claude.use('downloads')).catch(() => null) : Promise.resolve(null);
async function toggleRecord(){
  if (S.rec) { S.rec.mr.stop(); return; }
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) { toast('这个浏览器不支持录制，请用 Chrome 或 Safari 打开。', 4000); return; }
  const dl = await downloadsP;
  if (!dl && !LOCAL_SAVE) { toast('这里无法保存文件：请下载本地版网页后录制。', 4000); return; }
  const mc = map.getCanvas(); const c = document.createElement('canvas'); c.width = mc.width; c.height = mc.height;
  const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  if (!mime) { toast('这个浏览器不支持录制视频。', 4000); return; }
  const mr = new MediaRecorder(c.captureStream(30), { mimeType: mime, videoBitsPerSecond: 14e6 });
  const chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    S.rec = null; $('b-rec').classList.remove('on'); $('b-rec').querySelector('.txt').textContent = '录制视频';
    const blob = new Blob(chunks, { type: mime }); const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm'; const name = '飞行足迹.' + ext;
    toast('正在保存 ' + (blob.size / 1048576).toFixed(1) + ' MB 的视频…');
    if (dl) { try { await dl.save({ filename: name, data: blob }); toast('视频已保存：' + name, 3000); } catch (e) { toast(e && e.code === 'declined' ? '已取消保存。' : '保存失败，请重试。', 3000); } }
    else if (LOCAL_SAVE) { LOCAL_SAVE(blob, name); toast('视频已保存：' + name, 4000); }
  };
  mr.start(1000);
  S.rec = { mr, c, ctx: c.getContext('2d') };
  $('b-rec').classList.add('on'); $('b-rec').querySelector('.txt').textContent = '停止录制';
  toast('录制中：画面与回放同步，播放结束或再次点击即停止。', 3500);
  if (!S.playing) play();
}
$('b-rec').addEventListener('click', toggleRecord);
const basePause = pause;
pause = function(){ basePause(); if (S.rec && S.idx === S.steps.length - 1 && S.t >= S.steps[S.idx].dur) S.rec.mr.stop(); };

/* ---------- boot ---------- */
toast('正在加载地球…');
// start as soon as the style (sources and layers) is ready; imagery and terrain tiles keep streaming in during the opening shot
let booted = false;
async function boot(){
  if (booted) return; booted = true;
  initThree(); sizeAll();
  if (document.fonts && document.fonts.ready) { try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch (e) {} }
  $('b-view').classList.add('on');
  rebuild();
  // warm the photo cache in the background
  Object.keys(PHOTOS).forEach((k, i) => setTimeout(() => { const code = Object.keys(AP).find(c => cityKey(c) === k); if (code) photoFor(code); }, 300 + i * 120));
  $('toast').hidden = true;
  if (!HI) toast('在线高清卫星影像不可用，已切换为 NASA 蓝色弹珠底图。', 4500);
  rafId = requestAnimationFrame(loop);
  if (!reduced) setTimeout(play, 400);
}
map.once('style.load', boot);
map.once('load', boot);
})();
