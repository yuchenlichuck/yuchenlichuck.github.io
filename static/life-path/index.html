header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}

.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
/* track */
.track{display:flex;align-items:center;margin:4px 0 18px}
.stop{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--bg);flex:none}
.stop.done{background:var(--muted);border-color:var(--muted)}
.stop.match{background:var(--real);border-color:var(--real)}
.stop.now{border-color:var(--accent);box-shadow:0 0 0 4px rgba(201,100,66,.18)}
.seg{flex:1;height:2px;background:var(--line)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{font-size:12px;color:var(--muted)}
.stat b{float:right;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s ease}
/* options */
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);background:#fff}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt .t{font-weight:600}
.opt .d{color:var(--muted);font-size:14px}
.opt:disabled{cursor:default;opacity:.55}
.opt.picked{opacity:1;border-color:var(--accent);background:#fff}
.opt.real{opacity:1;border-color:var(--real)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:600;vertical-align:middle}
.tag.real{background:rgba(47,125,91,.12);color:var(--real)}
.tag.you{background:rgba(201,100,66,.12);color:var(--accent)}
.out{margin-top:16px;padding:14px 16px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 12px 12px 0;animation:in .35s ease}
.out.realbox{border-left-color:var(--real)}
.out p{margin:0}
.out .h{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.delta{font-size:13px;color:var(--muted);margin-top:6px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* result */
.big{font-family:var(--serif);font-size:clamp(46px,11vw,76px);line-height:1;color:var(--accent);margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.y{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.ok{color:var(--real);font-weight:700}
footer{margin-top:26px;color:var(--muted);font-size:13px;text-align:center}
[hidden]{display:none!important}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.card{padding:18px}th:nth-child(1),td.y{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  document.documentElement.lang=L?'en':'zh-CN';$('#lang').textContent=L?'中文':'EN';$('#foot').innerHTML=t('foot');
  if(view==='intro'){app.innerHTML='<h1>'+t('title')+'</h1><p class="lead">'+t('lead')+'</p><div class="card"><p style="margin-top:0">'+t('src')+'</p>'+
    '<div class="row" style="margin-top:6px"><button class="btn" id="go">'+t('start')+'</button></div></div>';$('#go').onclick=()=>{reset();view='play';render()};return}
  if(view==='end')return end();
  const q=Q[S.i],p=S.picks[S.i],done=p!=null,ri=q.o.findIndex(o=>o.real);
  let h=track()+stats()+'<div class="card"><div class="eyebrow">'+t('fork')+' '+(S.i+1)+' / '+Q.length+' · '+q.y+'</div><h2>'+esc(q.q[L])+'</h2><div class="opts">';
  q.o.forEach((o,i)=>{const cls=(done&&i===p?' picked':'')+(done&&o.real?' real':'');
    h+='<button class="opt'+cls+'" data-i="'+i+'"'+(done?' disabled':'')+'><span class="k">'+'ABC'[i]+'</span><span><span class="t">'+esc(o.t[L])+'</span>'+
      (done&&i===p?'<span class="tag you">'+t('you')+'</span>':'')+(done&&o.real?'<span class="tag real">'+t('real')+'</span>':'')+'<br><span class="d">'+esc(o.d[L])+'</span></span></button>'});
  h+='</div>';
  if(done){const o=q.o[p];
    if(q.open)h+='<div class="out realbox"><div class="h">'+t('tbd')+'</div><p>'+t('openOut')+'</p><div class="delta">'+delta(o.fx)+'</div></div>';
    else if(o.real)h+='<div class="out realbox"><div class="h">'+t('realOut')+'</div><p>'+esc(o.out[L])+'</p><div class="delta">'+t('same')+' '+delta(o.fx)+'</div></div>';
    else h+='<div class="out"><div class="h">'+t('yourOut')+'</div><p>'+esc(o.out[L])+'</p><div class="delta">'+delta(o.fx)+'</div></div>'+
      '<div class="out realbox"><div class="h">'+t('realOut')+'</div><p>'+esc(q.o[ri].out[L])+'</p></div>';
    h+='<div class="row"><button class="btn" id="nx">'+(S.i<Q.length-1?t('next'):t('finish'))+'</button></div>'}
  app.innerHTML=h+'</div>';
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  if(done){$('#nx').onclick=next;$('#nx').focus({preventScroll:true})}
}
function pick(i){if(S.picks[S.i]!=null)return;S.picks[S.i]=i;const fx=Q[S.i].o[i].fx;for(const k in fx)S.st[k]+=fx[k];render()}
function next(){if(S.i<Q.length-1){S.i++;render();scrollTo({top:0,behavior:'smooth'})}else{view='end';render();scrollTo({top:0})}}
function score(){const sc=Q.filter(q=>!q.open),n=sc.filter(q=>q.o[S.picks[Q.indexOf(q)]].real).length;return{n,tot:sc.length,pct:Math.round(n/sc.length*100)}}
function end(){const m=score(),top=Object.keys(S.st).sort((a,b)=>S.st[b]-S.st[a])[0],e=m.n>=m.tot-1?END.real:END[top];
  let h=track()+'<div class="card"><div class="eyebrow">'+t('match')+'</div><div class="big">'+m.pct+'%</div><div class="eyebrow">'+t('ending')+'</div><h2>'+e.t[L]+'</h2><p style="margin:0 0 14px">'+e.d[L]+'</p>'+stats()+
    '<table><thead><tr><th>'+t('year')+'</th><th>'+t('you')+'</th><th>'+t('real')+'</th></tr></thead><tbody>';
  Q.forEach((q,i)=>{const o=q.o[S.picks[i]],r=q.o.find(x=>x.real);
    h+='<tr><td class="y">'+q.y+'</td><td>'+(o.real?'<span class="ok">✓ </span>':'')+esc(o.t[L])+'</td><td>'+(r?esc(r.t[L])+'<br><span class="d" style="color:var(--muted);font-size:13px">'+esc(r.d[L])+'</span>':t('tbd'))+'</td></tr>'});
  h+='</tbody></table><div class="row"><button class="btn" id="ag">'+t('again')+'</button><button class="btn ghost" id="cp">'+t('copy')+'</button><a class="btn ghost" style="text-decoration:none" href="/press/">'+t('press')+'</a><a class="btn ghost" style="text-decoration:none" href="/">'+t('home')+'</a></div></div>';
  app.innerHTML=h;$('#ag').onclick=()=>{reset();view='play';render()};
  $('#cp').onclick=()=>{const s=t('title')+'｜'+t('match')+' '+m.pct+'% · '+e.t[L]+' → https://liyc.uno/life-path/';
    (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>{$('#cp').textContent=t('copied')}).catch(()=>prompt('',s))}}
$('#lang').onclick=()=>{L=1-L;render()};
addEventListener('keydown',e=>{if(view!=='play')return;const i='123abc'.indexOf(e.key.toLowerCase());
  if(i>=0&&S.picks[S.i]==null&&!e.metaKey&&!e.ctrlKey){pick(i%3)}});
reset();render();
</script>
</body>
</html>
