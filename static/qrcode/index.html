.row{display:flex;align-items:center;width:100%;height:64px;padding:0 16px;border:0;border-radius:16px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.03);color:#222;font:inherit;font-size:16px;font-weight:500;text-align:left;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,transform .15s}

.tile{flex:none;display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin-right:16px;border-radius:8px;color:#fff;overflow:hidden}
.tile svg{width:18px;height:18px;fill:currentColor}

.label{flex:1;min-width:0}

.list .row{animation:rise .5s backwards ease-out}
.list .row:nth-child(2){animation-delay:.04s}.list .row:nth-child(3){animation-delay:.08s}.list .row:nth-child(4){animation-delay:.12s}.list .row:nth-child(5){animation-delay:.16s}.list .row:nth-child(6){animation-delay:.2s}.list .row:nth-child(7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;transition:visibility 0s .28s}
.sheet.open{visibility:visible;transition:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s}
.sheet.open .backdrop{opacity:1}
.panel{position:relative;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;padding:20px 22px max(24px,calc(env(safe-area-inset-bottom) + 16px));background:#fff;border-radius:20px 20px 0 0;text-align:center;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}

.qr{display:block;width:min(260px,70vw);height:auto;margin:0 auto;border-radius:12px}
.hint{margin:16px 0 0;font-size:14px;line-height:1.5;color:#333}

.actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}

<script>
(function () {
  var FILE_NAME = 'yuchen-li-wechat-qr.jpg';
  var inWeChat = /MicroMessenger/i.test(navigator.userAgent);
  var coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  var mode = inWeChat ? 'wechat' : (coarse ? 'mobile' : 'desktop');

  var sheet = document.getElementById('sheet');
  var panel = document.getElementById('panel');
  var trigger = document.getElementById('wechat-btn');
  var hint = document.getElementById('hint');
  var actions = document.getElementById('actions');
  var file = null;
  var fetching = false;
  var isOpen = false;

  var hints = {
    wechat: ['长按二维码，选择「识别图中的二维码」即可添加', 'Long-press the QR code and tap \u201cScan QR Code in Image\u201d to add me.'],
    mobile: ['保存二维码后，打开微信「扫一扫」→ 相册 选择图片即可添加；也可长按图片保存', 'Save the QR code, then in WeChat tap Scan \u2192 Album and pick it. You can also long-press the image to save.'],
    desktop: ['请用手机微信扫描上方二维码', 'Scan the QR code above with WeChat on your phone.']
  };
  hint.appendChild(document.createTextNode(hints[mode][0]));
  var en = document.createElement('small');
  en.textContent = hints[mode][1];
  hint.appendChild(en);

  function download() {
    var a = document.createElement('a');
    a.href = './wechat.jpg';
    a.download = FILE_NAME;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function onSave() {
    if (mode === 'mobile' && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(function (err) {
        if (!err || err.name !== 'AbortError') download();
      });
      return;
    }
    download();
  }

  if (mode !== 'wechat') {
    var save = document.createElement('button');
    save.type = 'button';
    save.className = 'btn primary';
    save.textContent = '保存二维码 Save QR Code';
    save.addEventListener('click', onSave);
    actions.appendChild(save);
    if (mode === 'mobile') {
      var open = document.createElement('a');
      open.className = 'btn secondary';
      open.href = 'weixin://';
      open.textContent = '打开微信 Open WeChat';
      actions.appendChild(open);
    }
  }

  function prefetch() {
    if (file || fetching || !window.fetch || !window.File) return;
    fetching = true;
    fetch('./wechat.jpg').then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.blob();
    }).then(function (b) {
      file = new File([b], FILE_NAME, { type: 'image/jpeg' });
    }).catch(function () {}).then(function () { fetching = false; });
  }

  function openSheet() {
    if (isOpen) return;
    isOpen = true;
    sheet.classList.add('open');
    document.body.classList.add('locked');
    prefetch();
    panel.focus({ preventScroll: true });
  }

  function closeSheet() {
    if (!isOpen) return;
    isOpen = false;
    sheet.classList.remove('open');
    document.body.classList.remove('locked');
    if (location.hash === '#wechat') {
      history.replaceState(null, '', location.pathname + location.search);
    }
    trigger.focus({ preventScroll: true });
  }

  trigger.addEventListener('click', openSheet);
  document.getElementById('close').addEventListener('click', closeSheet);
  document.getElementById('backdrop').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
  });

  if (location.hash === '#wechat') openSheet();
})();
</script>
