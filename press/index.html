<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yuchen Li · 李禹陈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* Layout: dark-first "lab console" — a point-cloud hero (his research object), a trajectory strip, glowing platform tiles,
     then a sticky filter rail beside one chronological stream of verified items. Light variant keeps the same structure. */
  :root {
    --bg: #070b10;            /* deep space navy */
    --bg-2: #0c1218;
    --surface: rgba(255,255,255,.035);
    --surface-hi: rgba(255,255,255,.07);
    --fg: #e9eef2;
    --muted: #8a97a6;
    --line: rgba(160,190,220,.14);
    --line-hi: rgba(78,232,214,.45);
    --accent: #4ee8d6;        /* electric cyan-teal */
    --accent-ink: #04201c;
    --accent-2: #7c8cff;      /* periwinkle for depth / secondary */
    --gold: #f2c464;          /* 迪拜王子 */
    --ok: #5ee39a;  --ok-soft: rgba(94,227,154,.12);
    --self: #4ee8d6; --self-soft: rgba(78,232,214,.12);
    --warn: #f2c464; --warn-soft: rgba(242,196,100,.14);
    --glow: 0 0 0 1px rgba(78,232,214,.25), 0 0 40px -10px rgba(78,232,214,.35);
    --display: "Syne", "Noto Sans SC", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --grid: rgba(120,160,200,.07);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f6f8; --bg-2: #e9eef2; --surface: rgba(255,255,255,.75); --surface-hi: #ffffff; --fg: #0d161d; --muted: #566573;
      --line: rgba(20,50,80,.14); --line-hi: rgba(0,150,135,.5); --accent: #0a9486; --accent-ink: #ffffff; --accent-2: #4a5bd6; --gold: #a06d0e;
      --ok: #157a48; --ok-soft: rgba(21,122,72,.12); --self: #0a9486; --self-soft: rgba(10,148,134,.12); --warn: #9a6408; --warn-soft: rgba(154,100,8,.12);
      --glow: 0 0 0 1px rgba(10,148,134,.25), 0 10px 30px -18px rgba(10,148,134,.5); --grid: rgba(20,60,100,.07);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f6f8; --bg-2: #e9eef2; --surface: rgba(255,255,255,.75); --surface-hi: #ffffff; --fg: #0d161d; --muted: #566573;
    --line: rgba(20,50,80,.14); --line-hi: rgba(0,150,135,.5); --accent: #0a9486; --accent-ink: #ffffff; --accent-2: #4a5bd6; --gold: #a06d0e;
    --ok: #157a48; --ok-soft: rgba(21,122,72,.12); --self: #0a9486; --self-soft: rgba(10,148,134,.12); --warn: #9a6408; --warn-soft: rgba(154,100,8,.12);
    --glow: 0 0 0 1px rgba(10,148,134,.25), 0 10px 30px -18px rgba(10,148,134,.5); --grid: rgba(20,60,100,.07);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
         background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 48px 48px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
  .zh h1, .zh h2, .zh h3 { font-family: "Noto Sans SC", var(--display); }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px; padding-block: 0 72px; }
  .mono { font-family: var(--mono); }

  /* Top bar */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; }
  .brand .led { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .brand span.tag { color: var(--muted); font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* Hero with point cloud */
  .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); gap: 24px; align-items: center; padding-block: 44px 28px; min-height: 380px; }
  .hero::before { content: ""; position: absolute; inset: -20px 0 0; background: radial-gradient(60% 70% at 70% 45%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%); pointer-events: none; }
  .hero > * { position: relative; }
  .cloud { position: relative; aspect-ratio: 1; max-width: 100%; width: 100%; max-height: 420px; justify-self: center; }
  .cloud canvas { width: 100%; height: 100%; display: block; }
  .cloud .cap { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cloud .avatar { position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; transform: translate(-50%, -50%); border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent), 0 0 50px -8px var(--accent); }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 26px; height: 1px; background: var(--accent); }
  .hero h1 { font-size: clamp(38px, 6vw, 68px); line-height: .98; letter-spacing: -.02em; margin-top: 12px; }
  .hero h1 .zhname { display: block; font-family: "Noto Sans SC", var(--display); font-weight: 700; font-size: .58em; color: var(--accent); margin-top: 8px; letter-spacing: .04em; }
  .role { margin: 16px 0 0; font-size: 16.5px; font-weight: 500; max-width: 60ch; }
  .bio { margin: 8px 0 0; color: var(--muted); max-width: 64ch; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .meta b { color: var(--fg); font-weight: 500; }
  .copy { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 8px; font-family: var(--mono); font-size: 12px; cursor: pointer; color: var(--accent); }

  /* Trajectory strip */
  .traj { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin-top: 26px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .traj > div { padding: 10px 12px; border-right: 1px solid var(--line); min-width: 0; position: relative; }
  .traj > div:last-child { border-right: 0; }
  .traj .y { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .06em; }
  .traj .n { font-weight: 600; font-size: 13.5px; line-height: 1.25; margin-top: 2px; }
  .traj .r { font-size: 12px; color: var(--muted); }
  .traj > div::before { content: ""; position: absolute; left: 12px; bottom: 0; width: 28px; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); }

  /* Accounts grid */
  .accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 10px; margin-top: 14px; }
  .acct { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; padding: 11px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: inherit; min-width: 0; transition: border-color .15s, transform .15s, box-shadow .15s; }
  .acct:hover { text-decoration: none; border-color: var(--line-hi); box-shadow: var(--glow); transform: translateY(-1px); }
  .acct .nm { font-weight: 600; font-size: 13.5px; line-height: 1.2; display: block; }
  .acct .hd { font-family: var(--mono); font-size: 11.5px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .acct .st { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .glyph { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: -.02em;
           background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent-2) 18%, transparent)); color: var(--fg); border: 1px solid var(--line-hi); }
  .glyph.zh { font-family: "Noto Sans SC", var(--display); font-weight: 700; font-size: 12px; }
  .glyph svg { width: 20px; height: 20px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding-block: 24px 8px; }
  .stat { padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); position: relative; overflow: hidden; }
  .stat::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .8; }
  .stat .n { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--fg); }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: var(--mono); letter-spacing: .04em; text-transform: uppercase; }

  /* Two-column body */
  .body { display: grid; grid-template-columns: 284px minmax(0, 1fr); gap: 32px; padding-top: 24px; }
  .rail { position: sticky; top: calc(58px + env(safe-area-inset-top, 0px)); align-self: start; display: grid; gap: 14px; max-height: calc(100vh - 70px - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 2px; margin: -2px; scrollbar-width: thin; }
  .panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px; }
  .panel h3 { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-family: var(--mono); font-weight: 500; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--fg); }
  .chip:hover { border-color: var(--line-hi); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip .c { font-family: var(--mono); font-size: 11px; opacity: .75; margin-left: 4px; }
  .search { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg-2); color: var(--fg); font: inherit; }
  .method p { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); }
  .method ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
  .method li { margin: 4px 0; }
  .legend { display: grid; gap: 6px; font-size: 13px; margin-top: 10px; }
  .legend .row { display: flex; align-items: center; gap: 8px; }

  /* Stream */
  .stream { min-width: 0; }
  .year { display: flex; align-items: baseline; gap: 12px; margin: 26px 0 10px; }
  .year:first-child { margin-top: 0; }
  .year h2 { font-size: 24px; letter-spacing: -.01em; color: var(--accent); }
  .year .cnt { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .year::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-hi), var(--line) 40%, transparent); }
  .item { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 16px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color .15s, box-shadow .15s; }
  .item:hover { border-color: var(--line-hi); box-shadow: var(--glow); }
  .item .when { font-family: var(--mono); font-size: 12.5px; color: var(--accent); padding-top: 3px; font-variant-numeric: tabular-nums; }
  .item .when .yr { display: none; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 7px; }
  .tag { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); background: var(--bg-2); }
  .tag.plat { color: var(--fg); font-weight: 500; border-color: var(--line-hi); }
  .tag.lang { letter-spacing: .04em; }
  .item h3 { font-family: var(--body); font-size: 16.5px; font-weight: 600; line-height: 1.35; text-wrap: pretty; }
  .item h3 a { color: inherit; }
  .item h3 a:hover { color: var(--accent); }
  .outlet { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .sum { margin: 8px 0 0; color: var(--fg); max-width: 72ch; font-size: 14.5px; opacity: .92; }
  .ev { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 72ch; }
  .ev .k { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding-top: 2px; color: var(--accent); }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.verified { background: var(--ok-soft); color: var(--ok); }
  .badge.self { background: var(--self-soft); color: var(--self); }
  .badge.pending { background: var(--warn-soft); color: var(--warn); }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; }
  .links a::after { content: " ↗"; font-size: 11px; }
  .empty { padding: 40px 0; color: var(--muted); text-align: center; }

  .section { margin-top: 40px; }
  .section h2 { font-size: 20px; margin-bottom: 6px; }
  .section .lead { color: var(--muted); margin: 0 0 12px; max-width: 70ch; font-size: 14px; }
  .toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13.5px; }
  .toggle[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; max-width: 80ch; }
  .note p { margin: 6px 0; }

  @media (max-width: 900px) {
    .body { grid-template-columns: 1fr; gap: 20px; }
    .rail { position: static; max-height: none; overflow: visible; }
    .hero { grid-template-columns: 1fr; padding-top: 24px; }
    .cloud { max-height: 300px; width: min(100%, 300px); order: -1; }
    .traj { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .traj > div:nth-child(3) { border-right: 0; }
    .traj > div:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
  }
  @media (max-width: 520px) {
    .item { grid-template-columns: 1fr; gap: 6px; }
    .item .when .yr { display: inline; }
    .brand span.tag { display: none; }
    .traj { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .traj > div:nth-child(3) { border-right: 1px solid var(--line); }
    .traj > div:nth-child(even) { border-right: 0; }
    .traj > div:nth-child(-n+4) { border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>


<div class="top"><div class="wrap">
  <div class="brand"><span class="led" aria-hidden="true"></span>Yuchen Li · 李禹陈 <span class="tag" data-i18n="tagline"></span></div>
  <div class="seg" role="group" aria-label="Language">
    <button type="button" id="lang-en" aria-pressed="true">EN</button>
    <button type="button" id="lang-zh" aria-pressed="false">中文</button>
  </div>
</div></div>

<main class="wrap">
  <section class="hero">

  // ---- Point cloud: a torus knot sampled as ~1,400 points, rotated in 3D and depth-coded (near = bright accent, far = dim). ----
  (function cloud() {
    const cv = document.getElementById("pc"); if (!cv) return;
    const ctx = cv.getContext("2d");
    const N = 1400, pts = [];
    for (let i = 0; i < N; i++) {                        // (2,3) torus knot with radial jitter
      const u = i / N * Math.PI * 2 * 3, p = 2, qk = 3;
      const r = 1.6 + Math.cos(qk * u) * 0.75 + (Math.random() - .5) * .18;
      const jit = (Math.random() - .5) * .12;
      pts.push([r * Math.cos(p * u) + jit, r * Math.sin(p * u) + jit, Math.sin(qk * u) * 0.85 + (Math.random() - .5) * .18]);
    }
    const css = () => getComputedStyle(document.documentElement);
    let W = 0, H = 0, dpr = 1;
    function size() { const r = cv.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); W = cv.width = Math.round(r.width * dpr); H = cv.height = Math.round(r.height * dpr); }
    size(); addEventListener("resize", size);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let a = .6, b = .3;
    function frame() {
      const s = css(), acc = s.getPropertyValue("--accent").trim(), acc2 = s.getPropertyValue("--accent-2").trim();
      ctx.clearRect(0, 0, W, H);
      const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), R = Math.min(W, H) * 0.19, cx = W / 2, cy = H / 2;
      const proj = pts.map(([x, y, z]) => { const x1 = x * ca - z * sa, z1 = x * sa + z * ca; const y1 = y * cb - z1 * sb, z2 = y * sb + z1 * cb; return [x1, y1, z2]; }).sort((p, q) => p[2] - q[2]);
      for (const [x, y, z] of proj) {
        const d = (z + 2.8) / 5.6;                        // 0 far … 1 near
        const persp = 1 + z * 0.12;
        const px = cx + x * R * persp, py = cy + y * R * persp;
        const dist = Math.hypot(px - cx, py - cy);
        if (dist < 64 * dpr) continue;                     // keep the portrait clear
        ctx.globalAlpha = 0.25 + d * 0.7;
        ctx.fillStyle = d > 0.55 ? acc : acc2;
        ctx.beginPath(); ctx.arc(px, py, (0.9 + d * 1.6) * dpr, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // faint depth ring around the portrait
      ctx.strokeStyle = acc; ctx.globalAlpha = .35; ctx.lineWidth = dpr; ctx.setLineDash([3 * dpr, 6 * dpr]);
      ctx.beginPath(); ctx.arc(cx, cy, 74 * dpr, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      if (!reduce) { a += 0.0035; b += 0.0016; requestAnimationFrame(frame); }
    }
    frame();
  })();
