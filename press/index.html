025 年 6 月 12 日",ref:"m5",title:"72小时全程纪实：人类首度与AI亲密接触",url:"https://eu.36kr.com/zh/p/3333024150333961"},{blurb_en:"Invited by Next Capital to share perspectives on the Middle East 2030 vision and opportunities for Chinese founders in the region.",blurb_zh:"受嘉程资本邀请，分享对中东 2030 愿景及中国创业者在当地发展机遇的看法。",cta_en:"Read article",cta_zh:"阅读文章",meta_en:"Next Capital · Jan 2024",meta_zh:"嘉程资本 · 2024 年 1 月",ref:"m9",title:"迪拜商业英才李禹陈：浅谈中东2030愿景",url:"https://www.jiachengcap.com/blog/240105_56c8"},{blurb_en:"Guest on 掘金中东, covering KAUST, MBZUAI, Dubai Business Associates, Middle East universities and life across the region.",blurb_zh:"做客《掘金中东》，分享 KAUST、MBZUAI、Dubai Business Associates、中东高校与当地生活经历。",cta_en:"Listen",cta_zh:"收听节目",meta_en:"Xiaoyuzhou · Podcast",meta_zh:"小宇宙 · 播客",ref:"m7",title:"07. 去中东上学：全靠酋长资助，不用交学费，还赚钱！",url:"https://www.xiaoyuzhoufm.com/episode/6641cf18f968fce2cbbccdfc"}],items:[{date:"2026-03-19",ev_en:"Author list on arXiv (submitted 19 Mar 2026); listed on his Scholar profile and liyc.pw.",ev_zh:"arXiv 作者列表（2026-03-19 提交）；Scholar 主页与 liyc.pw 均收录。",id:"a1",lang:"en",links:[{l:"Hugging Face",u:"https://huggingface.co/papers/2603.18795"}],metrics:{cites:1},outlet:"arXiv · cs.CV",plat:"arxiv",scholar:"perceptio",status:"verified",sum_en:"First-author preprint. A VLM that generates SAM2 segmentation tokens and VQ-VAE depth tokens before answering; work done during the Amazon Science Prime Video internship. Co-authors: Amanmeet Garg, Shalini Chaudhuri, Rui Zhao, Garin Kessler.",sum_zh:"一作预印本。让视觉语言模型在作答前先生成 SAM2 分割 token 与 VQ-VAE 深度 token；完成于 Amazon Science Prime Video 实习期间。合作者：Amanmeet Garg、Shalini Chaudhuri、Rui Zhao、Garin Kessler。",title:"Perceptio: Perception Enhanced Vision Language Models via Spatial Token Generation",type:"academic",url:"https://arxiv.org/abs/2603.18795"},{date:"2025-08-01",ev_en:"Author list matches KAUST Vision-CAIR; on his Scholar profile (verified mbzuai.ac.ae email).",ev_zh:"作者列表与 KAUST Vision-CAIR 一致；Scholar 主页（已验证 mbzuai.ac.ae 邮箱）收录。",id:"a2",lang:"en",links:[{l:"GitHub",u:"https://github.com/Vision-CAIR/3DCoMPaT-v2"}],metrics:{cites:32},outlet:"IEEE TPAMI",plat:"arxiv",scholar:"compatpp",status:"verified",sum_en:"Journal extension of 3D CoMPaT (Slim, Li, Li, Ahmed, Ayman, Upadhyay, Abdelreheem, Prajapati, Pothigara, Wonka, Elhoseiny).",sum_zh:"3D CoMPaT 的期刊扩展版（Slim, Li, Li, Ahmed, Ayman, Upadhyay, Abdelreheem, Prajapati, Pothigara, Wonka, Elhoseiny）。",title:"3DCoMPaT++: An Improved Large-scale 3D Vision Dataset for Compositional Recognition",type:"academic",url:"https://arxiv.org/abs/2310.18511"},{date:"2023-06-18",ev_en:"Organizer page names him with the KAUST affiliation; liyc.pw lists 'core organizer'.",ev_zh:"组织者页面列出其姓名与 KAUST 隶属；liyc.pw 写明「core organizer」。",id:"a3",lang:"en",links:[],outlet:"CVPR 2023 Workshop",plat:"web",status:"verified",sum_en:'Listed as a challenge organizer ("Yuchen Li, Ph.D. Student, KAUST") alongside Habib Slim, Mahmoud Ahmed, Mohamed Ayman, Xiang Li, Peter Wonka and Mohamed Elhoseiny.',sum_zh:"以「Yuchen Li, Ph.D. Student, KAUST」身份列为挑战赛组织者，与 Habib Slim、Mahmoud Ahmed、Mohamed Ayman、Xiang Li、Peter Wonka、Mohamed Elhoseiny 同列。",title:"C3DV: 1st Workshop on Compositional 3D Vision — challenge organizer",type:"academic",url:"https://3dcompat-dataset.org/workshop/C3DV23/"},{date:"2022-10-23",ev_en:"Author list; KAUST CEMSE profile lists it; his GitHub pins the repo.",ev_zh:"作者列表；KAUST CEMSE 主页收录；其 GitHub 置顶该仓库。",id:"a4",lang:"en",links:[{l:"Dataset site",u:"https://3dcompat-dataset.org/"},{l:"GitHub",u:"https://github.com/Vision-CAIR/3DCoMPaT"}],metrics:{cites:31},outlet:"ECCV 2022 · Oral",plat:"web",scholar:"compat",status:"verified",sum_en:"Co-first author with Ujjwal Upadhyay (2.7% oral acceptance). Dataset of 7.19M rendered compositions of materials on parts of 3D shapes.",sum_zh:"与 Ujjwal Upadhyay 共同一作（口头报告，录取率 2.7%）。包含 719 万张 3D 形状部件材质组合渲染的数据集。",title:"3D CoMPaT: Composition of Materials on Parts of 3D Things",type:"academic",url:"https://www.ecva.net/papers/eccv_2022/papers_ECCV/html/3631_ECCV_2022_paper.php"},{date:"2022-06-09",ev_en:"Author list; on his Scholar profile; KAUST profile lists it.",ev_zh:"作者列表；Scholar 主页收录；KAUST 主页列出。",id:"a5",lang:"en",links:[{l:"GitHub",u:"https://github.com/guochengqian/PointNeXt"}],metrics:{cites:1629,stars:1100},outlet:"NeurIPS 2022",plat:"arxiv",scholar:"pointnext",status:"verified",sum_en:"Second author, with Guocheng Qian (first author), Houwen Peng, Jinjie Mai, Hasan Hammoud, Mohamed Elhoseiny and Bernard Ghanem. The official repo has 1.1k+ stars.",sum_zh:"第二作者，合作者为 Guocheng Qian（第一作者）、Houwen Peng、Jinjie Mai、Hasan Hammoud、Mohamed Elhoseiny、Bernard Ghanem。官方仓库 1.1k+ star。",title:"PointNeXt: Revisiting PointNet++ with Improved Training and Scaling Strategies",type:"academic",url:"https://arxiv.org/abs/2206.04670"},{date:"2021-02-09",ev_en:"On his Scholar profile; KAUST profile lists 'AAAI Meta Learning Workshop 2021 (oral)'.",ev_zh:"Scholar 主页收录；KAUST 主页列出「AAAI Meta Learning Workshop 2021 (oral)」。",id:"a6",lang:"en",links:[{l:"Code (his fork)",u:"https://github.com/yuchenlichuck/prototypical-random-walk"}],metrics:{cites:26},outlet:"AAAI-21 Meta-Learning Workshop · Oral",plat:"arxiv",scholar:"fewshot",status:"verified",sum_en:"With Ahmed Ayyad, Raden Muaz, Shadi Albarqouni and Mohamed Elhoseiny. His first paper, written as a SUSTech undergraduate working with KAUST Vision-CAIR.",sum_zh:"与 Ahmed Ayyad、Raden Muaz、Shadi Albarqouni、Mohamed Elhoseiny 合作。其第一篇论文，本科期间在 KAUST Vision-CAIR 完成。",title:"Semi-supervised Few-shot Learning with Prototypical Random Walks",type:"academic",url:"https://arxiv.org/abs/1903.02164"},{date:"2026-05-06",ev_en:'Published from his Zhihu account (ID 南小环, education: KAUST CS). Article text: "本文第一作者为李禹陈（Yuchen Li）".',ev_zh:"由本人知乎账号（ID 南小环，教育经历 KAUST 计算机科学）发布；原文「本文第一作者为李禹陈（Yuchen Li）」。",id:"m1",lang:"zh",links:[],metrics:{votes:2},outlet:"知乎专栏 · 南小环（本人账号）",plat:"zhihu",status:"self",sum_en:"Long-form Chinese explainer of the Perceptio paper (method, HardBLINK results, limitations), written on his own Zhihu account 南小环. Closes with an author bio: first author, 3rd-year MBZUAI CV PhD; work done at Amazon Science Prime Video.",sum_zh:"在本人知乎账号「南小环」上发布的 Perceptio 论文中文长文解读（方法、HardBLINK 结果、局限）。文末作者介绍：一作李禹陈，MBZUAI 计算机视觉系三年级博士生，研究完成于 Amazon Science Prime Video 实习期间。",title:"Perceptio：感知增强视觉语言模型，让大模型先“看懂远近”再回答",type:"zhihu",url:"https://zhuanlan.zhihu.com/p/2035454055716233920"},{date:"2025-09-19",ev_en:'Article text: "202房间的李禹陈，是全球首所人工智能大学（MBZUAI）的PhD".',ev_zh:"原文：「202房间的李禹陈，是全球首所人工智能大学（MBZUAI）的PhD」。",id:"m2",lang:"zh",links:[],outlet:"腾讯新闻 · 五源资本",plat:"tencent",status:"verified",sum_en:"5Y Capital's wrap-up of its 72-hour AI Survival Challenge documentary series. Room 202: Yuchen Li, PhD at MBZUAI, flew back from Abu Dhabi wanting to become a 'first-generation AI director'; day 1 hand-built an AI browser to order food, day 3 generated 100+ songs from the room's chat logs.",sum_zh:"五源资本对「72小时AI生存挑战」微纪录片系列的总结。202 房间的李禹陈是全球首所人工智能大学（MBZUAI）的 PhD，专程从阿布扎比回国，带着「想做第一代 AI 导演」的野心；第一天手搓 AI 浏览器点外卖，第三天用房间聊天记录生成上百首歌。",title:"一组关于AI和人的真实故事影像｜72小时AI生存挑战",type:"news",url:"https://news.qq.com/rain/a/20250919A055PT00"},{date:"2025-07-14",ev_en:'Video description: "迎来了来自全球首所人工智能大学（MBZUAI）的PhD李禹陈". 565 views · 27 likes at capture.',ev_zh:"视频简介：「迎来了来自全球首所人工智能大学（MBZUAI）的PhD李禹陈」。采集时 565 播放 · 27 赞。",id:"m3",lang:"zh",links:[{l:"小红书版 (五源资本)",u:"https://www.xiaohongshu.com/discovery/item/6878d8b1000000001203c200?source=webshare&xhsshare=pc_web&xsec_token=ABfbZPrRgsTjluPxkjxgXAE1DA_WBM4M2WK4hFHIsZ0R0=&xsec_source=pc_share"}],metrics:{likes:27,views:565},outlet:"Bilibili · 五源资本",plat:"bilibili",status:"verified",sum_en:`Episode 2 of the micro-documentary series, devoted to him (11 min 47 s). Browser-building, auto food ordering, songwriting, dance-MV generation, and a walk-through 'memoir' video; coding until 3:30 am. Quote: "the more external tools were stripped away, the more art and emotional expression carried me."`,sum_zh:"微纪录片第二期，整期以他为主角（11 分 47 秒）。尝试浏览器开发、自动点外卖、写歌、舞蹈 MV 生成与走马灯式「人生回忆录」；凌晨三点半还在写代码。金句：「越是剥离一切外部工具，我越觉得，是艺术和情绪表达支撑我走得更远。」",title:"72小时AI生存挑战｜AI博士的极限72小时",type:"video",url:"https://www.bilibili.com/video/BV1uguizREY3/"},{date:"2025-06-19",ev_en:"Names 李禹陈 as a PhD student at the world's first AI university who flew 9,000 km from Abu Dhabi.",ev_zh:"文中写明李禹陈为全球第一所 AI 大学在读博士生，从阿布扎比飞行 9,000 公里参赛。",id:"m4",lang:"zh",links:[],outlet:"36氪 · 五源资本",plat:"36kr",status:"verified",sum_en:"Organizer's account of the 15–18 May 2025 challenge in Shanghai: seven players, one AI-only computer, ¥100. His arc: custom browser → food ordering → pivot to creation, 100+ AI songs, MVs and a 'digital immortality' memoir. Aspires to be among the first generation of AI directors.",sum_zh:"主办方对 2025 年 5 月 15–18 日上海挑战的复盘：七位玩家、一台只装 AI 工具的电脑、100 元。他的路线：自制浏览器 → 点外卖 → 转向创作，生成上百首 AI 歌曲、MV 与「数字永生」回忆录；立志成为第一代 AI 导演。",title:"72小时AI生存挑战，发生了什么？",type:"news",url:"https://36kr.com/p/3343148321318408"},{date:"2025-06-12",ev_en:`Article text: "李禹陈，全球第一所AI大学'穆罕默德·本·扎耶德人工智能大学'在读博士研究生".`,ev_zh:"原文：「李禹陈，全球第一所AI大学『穆罕默德·本·扎耶德人工智能大学』在读博士研究生」。",id:"m5",lang:"zh",links:[{l:"36Kr Europe",u:"https://eu.36kr.com/zh/p/3333024150333961"},{l:"今日头条 mirror",u:"https://www.toutiao.com/article/7514920985858982436/"}],outlet:"36氪 · 陈之琰",plat:"36kr",status:"verified",sum_en:"Feature-length report on the challenge. Introduces him as a doctoral student at MBZUAI; he built a makeshift browser, went 'bankrupt' on waffles, chose 15 minutes of fresh air (and a cat) as his reward, and finished an AI-assisted personal memoir video.",sum_zh:"对挑战的长篇全纪实。介绍其为 MBZUAI 在读博士研究生；他手搓浏览器、因华夫饼「破产」、把奖励用在天台放风 15 分钟撸猫，并完成了一支 AI 辅助的个人回忆录视频。",title:"72小时全纪实：人类与AI的第一次亲密接触",type:"news",url:"https://www.sohu.com/a/903697559_114778"},{date:"2025-06-12",ev_en:'Description lists an "AI博士生" among the 7 players; episode 2 names him.',ev_zh:"简介中七位玩家含「AI博士生」；第二期点名为李禹陈。",id:"m6",lang:"zh",links:[],metrics:{views:11992},outlet:"Bilibili · 五源资本",plat:"bilibili",status:"verified",sum_en:"Trailer for the series (≈12k views). Introduces the seven players, including 'an AI PhD student'; his own episode (above) confirms that is him.",sum_zh:"系列先导片（约 1.2 万播放）。介绍七位玩家，其中「AI 博士生」即为他本人（由其个人专集确认）。",title:"「72小时AI生存挑战」先导片｜只能靠AI度过三天，他们都经历了什么？",type:"video",url:"https://www.bilibili.com/video/BV1B6MFzeEPf/"},{date:"2024-05-13",ev_en:'Show notes: "李禹陈 小红书ID：迪拜王子 … KAUST … 2023年迪拜商业英才 … MBZUAI计算机视觉读博" — matches liyc.pw and his rednote profile name.',ev_zh:"节目简介：「李禹陈 小红书ID：迪拜王子 … KAUST … 2023年迪拜商业英才 … MBZUAI计算机视觉读博」，与 liyc.pw 及其小红书昵称一致。",id:"m7",lang:"zh",links:[{l:"小宇宙",u:"https://www.xiaoyuzhoufm.com/episode/6641cf18f968fce2cbbccdfc"},{l:"看中东 DeepMENA 公众号 (05-14)",u:"https://mp.weixin.qq.com/s?src=11&timestamp=1790714767&ver=6996&signature=URM227PWBxbI70Tcu85Z*iMd-sMtuJ8kmpR2uYCMbAjhlsHXqPSbDbOKGz0j0HEwYPA9BNnvpUiCX0OBOjna3BNpKwcCxsHoa9f2EzWOshSb*LiEQLhfnstURpdZn8LU&new=1"}],metrics:{plays:233},outlet:"掘金中东 播客 · DeepMENA",plat:"ximalaya",status:"verified",sum_en:"57-minute interview with host 徐皓天. Born 1998; SUSTech → KAUST at 20 → Dubai Business Associates 2023 → MBZUAI PhD in AIGC. Covers Gulf universities, incubators, teaching in a Lebanese refugee camp, and visiting the Dubai police chief and a Dubai prince at home. Show notes list his rednote ID 迪拜王子.",sum_zh:"与主播徐皓天的 57 分钟对谈。98 年出生；南科大 → 20 岁入读 KAUST → 2023 迪拜商业英才 → MBZUAI 读 AIGC 博士。聊中东高校、孵化器、黎巴嫩难民营支教，以及去迪拜警察局长、迪拜王子家做客。节目简介写明其小红书 ID：迪拜王子。",title:"07. 去中东上学：全靠酋长资助，不用交学费，还赚钱",type:"podcast",url:"https://www.ximalaya.com/sound/728588159"},{date:"2024-01-30",ev_en:'Quoted as "曾经入选过迪拜商业英才的计算机视觉博士李禹陈".',ev_zh:"原文：「曾经入选过迪拜商业英才的计算机视觉博士李禹陈」。",id:"m8",lang:"zh",links:[],outlet:"嘉程资本 NextCapital · 公众号",plat:"wechat",status:"verified",sum_en:'Investor field notes on the Middle East that quote him on why Chinese people enjoy natural goodwill in the Gulf ("seek knowledge, even unto China").',sum_zh:"嘉程团队中东出海观察，引用他关于「中东人对中国人有天然好感」的观点（「求知，哪怕远在中国」）。",title:"嘉程团队中东出海观察：“经济转型”与“雄心叙事”",type:"news",url:"https://mp.weixin.qq.com/s?src=11&timestamp=1790714767&ve
