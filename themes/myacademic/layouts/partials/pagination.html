{{ if or (.Paginator.HasPrev) (.Paginator.HasNext) }}
<nav aria-label="Pagination">
  <ul class="pagination justify-content-center">
    {{ if .Paginator.HasPrev }}
    <li class="page-item"><a class="page-link" href="{{ .Paginator.Prev.URL }}" aria-label="Previous page">&laquo;</a></li>
    {{ end }}
    {{ if .Paginator.HasNext }}
    <li class="page-item"><a class="page-link" href="{{ .Paginator.Next.URL }}" aria-label="Next page">&raquo;</a></li>
    {{ end }}
  </ul>
</nav>
{{ end }}
