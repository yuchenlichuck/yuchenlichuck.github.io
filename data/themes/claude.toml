# Theme metadata — "Neural" skin (dark, cyan). The body class stays `theme-claude`
# so the widget layout rules in _claude.scss keep applying; assets/css/neural.css restyles them.
name = "Claude"
font = "Neural"

# Is theme light or dark?
light = false

# Primary
primary = "#4ee8d6"
link = "#4ee8d6"
link_hover = "#8ff3e8"

# Menu
menu_primary = "rgba(7, 11, 16, 0.72)"
menu_text = "#cfd7df"
menu_text_active = "#4ee8d6"
menu_title = "#e9eef2"

# Background
background = "#070b10"

# Home sections
home_section_odd = "transparent"
home_section_even = "transparent"
